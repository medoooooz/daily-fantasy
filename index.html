<style>

#toast.show{opacity:1;transform:translateX(-50%)}
.login{justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 24px 24px;gap:12px;flex:1;display:flex;flex-direction:column}
.logo{width:64px;height:64px;border-radius:16px;background:#2fd06b;color:#04150a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:34px}

<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getMessaging, getToken, onMessage, isSupported } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, collection, query, where, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ───────── الإعدادات ───────── */
const firebaseConfig = {
  apiKey: "AIzaSyC0RGeDSrze6LYWg3evAB1HYgLVT0_iPx8",
  authDomain: "daily-fantasy-4e288.firebaseapp.com",
  projectId: "daily-fantasy-4e288",
  storageBucket: "daily-fantasy-4e288.firebasestorage.app",
  messagingSenderId: "856010520496",
  appId: "1:856010520496:web:526a9ee316e7b4b5f24875"
};
const VAPID_KEY = 'BJCvYHRpVeKdXwapyT7aKp0nMnw5Y7ZhTkIv8Dips-sYm9lXHEw96ff3ZloT2pk2xhK-3_PaJj4Oi5UwljnQhW0';   // المفتاح العام من Firebase > Project settings > Cloud Messaging > Web Push certificates
const TZ = 'Africa/Cairo';   // لازم تكون زي TZ في Code.gs
const CAP_MULT = 2;          // لازم يكون زي CAPTAIN_MULT في Code.gs
const POS = { 1: 'حارس', 2: 'مدافع', 3: 'وسط', 4: 'مهاجم' };
const CHIPS = {
  free_team: { n: 'عبيلو', d: 'ممكن ٤ لاعبين من نفس الفريق (أو ٣ و١)، بس لاعب واحد من كل مركز.' },
  free_pos: { n: 'أهو كيفي كده', d: 'ممكن أي مراكز تحبها، بس ٢ لاعبين من كل فريق بحد أقصى.' },
  steal: { n: 'هلقط رزقي', d: 'اختار فريق، وبعد نهاية الماتش بتاخد نقط أعلى لاعب فيه كبونص فوق اختياراتك.' }
};
const MAX_CHIPS = 2;   // لازم يكون زي MAX_CHIPS_PER_GW في Code.gs
const AR = { 'Arsenal':'أرسنال','Aston Villa':'أستون فيلا','Bournemouth':'بورنموث','Brentford':'برينتفورد','Brighton':'برايتون','Burnley':'بيرنلي','Chelsea':'تشيلسي','Crystal Palace':'كريستال بالاس','Everton':'إيفرتون','Fulham':'فولهام','Leeds':'ليدز','Liverpool':'ليفربول','Man City':'مان سيتي','Man Utd':'مان يونايتد','Newcastle':'نيوكاسل',"Nott'm Forest":'نوتنجهام فورست','Sunderland':'سندرلاند','Spurs':'توتنهام','West Ham':'وست هام','Wolves':'وولفرهامبتون','Leicester':'ليستر','Ipswich':'إبسويتش','Southampton':'ساوثهامبتون','Coventry':'كوفنتري','Hull':'هال سيتي' };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ───────── أدوات ───────── */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const nf = new Intl.NumberFormat('ar-EG');
const N = v => nf.format(v);
const fmtTime = ms => new Intl.DateTimeFormat('ar-EG', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: TZ }).format(ms);
const fmtDay = ms => new Intl.DateTimeFormat('ar-EG', { weekday: 'long', day: 'numeric', month: 'long', timeZone: TZ }).format(ms);
const dayKey = ms => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(ms);
const tsMs = t => (t && t.toMillis) ? t.toMillis() : (t ? Date.parse(t) : null);
const teamName = t => AR[t.name] || t.name;
const hue = code => (Number(code) * 47) % 360;
const END_AFTER = 3.5 * 3600 * 1000;

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 3800);
}

function authMsg(e) {
  const m = {
    'auth/invalid-credential': 'الإيميل أو كلمة السر غلط',
    'auth/wrong-password': 'كلمة السر غلط',
    'auth/user-not-found': 'مفيش حساب بالإيميل ده',
    'auth/invalid-email': 'الإيميل مش مكتوب صح',
    'auth/email-already-in-use': 'الإيميل ده مسجل قبل كده، جرّب تدخل',
    'auth/weak-password': 'كلمة السر ضعيفة، لازم ٦ حروف أو أكتر',
    'auth/missing-password': 'اكتب كلمة السر',
    'auth/too-many-requests': 'محاولات كتير، استنى شوية وجرّب تاني',
    'auth/network-request-failed': 'مفيش اتصال بالإنترنت',
    'auth/popup-blocked': 'المتصفح منع نافذة الدخول، اسمح بالنوافذ المنبثقة',
    'auth/unauthorized-domain': 'عنوان الموقع مش مضاف في Firebase (Authentication > Settings > Authorized domains)'
  };
  return m[e.code] || ('حصلت مشكلة: ' + (e.code || e.message));
}

/* ───────── الحالة ───────── */
const S = {
  view: 'loading', user: null, profile: null, admin: false,
  mode: 'login', authErr: '', email: '',
  gws: {}, gw: null, day: null, picks: {}, fxdocs: {}, scores: {},
  boards: {}, bt: 'total', myGwPts: null,
  fx: null, pos: 1, q: '', save: '',
  users: [], uq: '',
  stats: {}, st: null, fcm: null,
  tours: [], tour: null, tt: { tab: 'groups', r: null }, tn: null, cal: null
};
const newSt = () => ({ kind: 'gw', fid: null, day: null, tab: 'caps', q: '', opp: null, oq: '', ex: {}, loading: false });
S.st = newSt();

/* ───────── مكونات صغيرة ───────── */
const SHIRT = c => `<svg viewBox="0 0 24 24"><path fill="${c}" d="M8 3l-5 3 2 4 2-1v11h10V9l2 1 2-4-5-3c-1 2-5 2-6 0z"/></svg>`;
/* صور اللاعبين والشعارات: بنجرّب مجلد الموسم الأحدث الأول ثم اللي قبله، ولو مفيش بنسيب الشارة/القميص */
const PH = ['premierleague26', 'premierleague25'];
const BD = ['premierleague26/badges/70/t', 'premierleague25/badges/70/t', 'premierleague/badges/70/t'];
const IMG_URL = {
  p: (i, c) => PH[i] ? `https://resources.premierleague.com/${PH[i]}/photos/players/110x140/${c}.png` : null,
  b: (i, c) => BD[i] ? `https://resources.premierleague.com/${BD[i]}${c}.png` : null
};
window.imgNext = img => {
  const i = Number(img.dataset.i) + 1, u = IMG_URL[img.dataset.k](i, img.dataset.c);
  if (u) { img.dataset.i = i; img.src = u; } else img.remove();
};
function crest(t, w = 38) {
  const h = Math.round(w * 1.1);
  return `<span class="crw" style="width:${w}px;height:${h}px"><span class="cr" style="--c:hsl(${hue(t.code)} 55% 38%)">${esc(t.sn)}</span><img src="${IMG_URL.b(0, esc(t.code))}" data-k="b" data-i="0" data-c="${esc(t.code)}" alt="" referrerpolicy="no-referrer" loading="lazy" onload="this.previousElementSibling.style.display='none'" onerror="imgNext(this)"></span>`;
}
function photo(p) {
  return `<span class="ph">${SHIRT(`hsl(${hue(p.t * 3)} 60% 50%)`)}<img src="${IMG_URL.p(0, esc(p.c))}" data-k="p" data-i="0" data-c="${esc(p.c)}" alt="" referrerpolicy="no-referrer" loading="lazy" onload="this.previousElementSibling.style.display='none'" onerror="imgNext(this)"></span>`;
}
const initial = s => esc((s || '?').trim().charAt(0).toUpperCase());

/* ───────── منطق الجولات ───────── */
const gwNums = () => Object.keys(S.gws).map(Number).sort((a, b) => a - b);
const koOf = f => f.ko ? Date.parse(f.ko) : null;
function gwFixtures(g) { return (S.gws[g] && S.gws[g].fixtures) || []; }
function fxInfo(fid) {
  for (const g of gwNums()) { const f = gwFixtures(g).find(x => String(x.id) === String(fid)); if (f) return f; }
  return null;
}
function kickoffOf(fid) {
  const d = S.fxdocs[fid];
  if (d && d.kickoff) return d.kickoff;
  const f = fxInfo(fid);
  return f ? koOf(f) : null;
}
const isLocked = fid => { const k = kickoffOf(fid); return !k || Date.now() >= k; };
const dayOfFx = fid => { const k = kickoffOf(fid); return k ? dayKey(k) : 'tbd'; };

function defaultGw() {
  const nums = gwNums(), now = Date.now();
  const live = nums.find(g => gwFixtures(g).some(f => koOf(f) && koOf(f) + END_AFTER > now));
  return live ?? nums[nums.length - 1];
}
function daysOf(g) {
  const map = {};
  gwFixtures(g).forEach(f => {
    const k = koOf(f);
    const key = k ? dayKey(k) : 'tbd';
    (map[key] = map[key] || { key, label: k ? fmtDay(k) : 'مواعيد لسه مش معروفة', list: [] }).list.push(f);
  });
  return Object.values(map).sort((a, b) => a.key.localeCompare(b.key)).map(d => {
    d.list.sort((a, b) => (koOf(a) || 9e15) - (koOf(b) || 9e15));
    return d;
  });
}
function chooseDay() {
  const days = daysOf(S.gw), now = Date.now();
  if (!days.length) { S.day = null; return; }
  const open = days.find(d => d.list.some(f => koOf(f) && koOf(f) + END_AFTER > now));
  S.day = (open || days[days.length - 1]).key;
}
const pickOf = fid => (S.picks[fid] = S.picks[fid] || { ids: [], cap: null, chip: null, team: null });

/* ───────── تحميل البيانات ───────── */
async function loadPicks() {
  await flushSaves();
  const s = await getDocs(query(collection(db, 'picks'), where('uid', '==', S.user.uid), where('gw', '==', S.gw)));
  S.picks = {};
  s.docs.forEach(d => { const x = d.data(); S.picks[x.fid] = { ids: x.ids || [], cap: x.cap ?? null, chip: x.chip ?? null, team: x.team ?? null }; });
}
async function loadMyPts() {
  try {
    const b = await getDoc(doc(db, 'board', 'gw_' + S.gw));
    if (b.exists()) { S.boards['gw_' + S.gw] = b.data(); const r = b.data().rows.find(r => r.uid === S.user.uid); S.myGwPts = r ? r.pts : 0; }
    else S.myGwPts = null;
  } catch (e) { S.myGwPts = null; }
}
async function loadRound() {
  const snap = await getDocs(collection(db, 'gw'));
  let start = 0;
  try { const c = await getDoc(doc(db, 'config', 'app')); if (c.exists() && c.data().startGw) start = c.data().startGw; } catch (e) { /* مفيش إعداد: اعرض الكل */ }
  S.gws = {};
  snap.docs.forEach(d => { if (Number(d.id) >= start) S.gws[Number(d.id)] = d.data(); });
  if (!gwNums().length) { S.gw = null; return; }
  if (S.gw == null || !S.gws[S.gw]) S.gw = defaultGw();
  await Promise.all([loadPicks(), loadMyPts()]);
  chooseDay();
}
async function bootUser() {
  const ps = await getDoc(doc(db, 'users', S.user.uid));
  if (!ps.exists()) { S.profile = null; S.view = 'setup'; return; }
  S.profile = ps.data();
  if (S.profile.banned) { S.view = 'banned'; return; }
  try { const a = await getDoc(doc(db, 'admins', S.user.uid)); S.admin = a.exists(); } catch (e) { S.admin = false; }
  await loadRound();
  S.view = 'round';
  refreshPush();
}
async function loadFixture(fid, fresh = true) {
  if (!S.fxdocs[fid]) {
    const s = await getDoc(doc(db, 'fixtures', String(fid)));
    if (!s.exists()) throw new Error('الماتش مش موجود');
    const d = s.data();
    S.fxdocs[fid] = { ...d, kickoff: tsMs(d.kickoff) };
  }
  if (isLocked(fid) && (fresh || !S.scores[fid])) {
    try { const sc = await getDoc(doc(db, 'scores', String(fid))); S.scores[fid] = sc.exists() ? sc.data() : { pts: {}, st: {}, status: 'ns' }; }
    catch (e) { S.scores[fid] = { pts: {}, st: {}, status: 'ns' }; }
  }
}
async function loadBoard(id) {
  const s = await getDoc(doc(db, 'board', id));
  S.boards[id] = s.exists() ? s.data() : null;
}

/* ───────── الاختيارات ───────── */
function canPick(fx, p, pl) {
  if (p.ids.length >= 4) return 'اخترت ٤ لاعبين بالفعل';
  const of = id => fx.players.find(x => x.i === id);
  if (p.chip !== 'free_pos' && p.ids.some(id => { const o = of(id); return o && o.p === pl.p; })) return 'مركز ' + POS[pl.p] + ' مختار بالفعل، شيله الأول';
  const same = p.ids.filter(id => { const o = of(id); return o && o.t === pl.t; }).length;
  if (p.chip !== 'free_team' && same >= 2) return 'مينفعش أكتر من لاعبين من نفس الفريق';
  return null;
}

const pushConfigured = () => VAPID_KEY && !VAPID_KEY.startsWith('PASTE');
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent);
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
let fgBound = false;
async function pushToken() {
  const reg = await navigator.serviceWorker.ready;
  return getToken(getMessaging(app), { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
}
function bindForeground() {
  if (fgBound) return; fgBound = true;
  try { onMessage(getMessaging(app), p => { const n = p.notification || {}; toast((n.title || '') + (n.body ? ': ' + n.body : '')); }); } catch (e) { /* مش مهم */ }
}
async function loadFcm() {

}
/* لو التنبيهات مفعّلة، بنجدّد التوكن في الخلفية (بيتغير أحياناً) */
async function refreshPush() {
  try {
    if (!pushConfigured() || !(await isSupported()) || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    await loadFcm();
    if (!S.fcm || !S.fcm.on) return;
    bindForeground();
    const t = await pushToken();
    if (t && t !== S.fcm.token) { await setDoc(doc(db, 'fcm', S.user.uid), { token: t, on: true, updatedAt: serverTimestamp() }); S.fcm = { token: t, on: true }; }
  } catch (e) { console.error(e); }
}
async function enablePush() {
  if (!pushConfigured()) return toast('التنبيهات لسه مش جاهزة، الإدارة محتاجة تضيف مفتاح التنبيهات');
  if (isIOS() && !isStandalone()) return toast('على الآيفون ضيف التطبيق للشاشة الرئيسية الأول (مشاركة ثم Add to Home Screen) وافتحه منها');
  try {
    if (!(await isSupported())) return toast('المتصفح ده مش بيدعم التنبيهات');
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast('لازم توافق على الإشعارات من إعدادات المتصفح');
    const token = await pushToken();
    if (!token) return toast('مقدرتش أجيب توكن التنبيهات');
    await setDoc(doc(db, 'fcm', S.user.uid), { token, on: true, updatedAt: serverTimestamp() });
    S.fcm = { token, on: true };
    bindForeground();

function shuffled(arr, rand) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

}

  const fixtures = [];
  groups.forEach((g, gi) => {
    let rr = roundRobin(g.uids);
    if (legs === 2) rr = rr.concat(rr.map(m => m.map(([x, y]) => [y, x])));
    rr.slice(0, rounds).forEach((m, r) => m.forEach(([a, b]) => { if (a && b) fixtures.push({ r, g: gi, a, b }); }));

}

    <div style="display:flex;gap:8px"><div class="k ctr g"><div class="d" style="font-size:26px">${me ? N(me.pts) : '—'}</div><div class="m">إجمالي النقط</div></div><div class="k ctr g"><div class="d" style="font-size:26px">${me ? N(me.rank) : '—'}</div><div class="m">المركز${rows.length ? ' من ' + N(rows.length) : ''}</div></div></div>
    <div class="k"><div class="r j"><div class="g"><b>تنبيهات الماتشات</b><div class="m">${S.fcm && S.fcm.on ? 'مفعّلة: هنبعتلك قبل الماتش بحوالي ساعة لو تشكيلتك ناقصة.' : 'فعّلها علشان يوصلك تنبيه قبل الماتش بساعة لو تشكيلتك ناقصة.'}</div></div><button class="bt ${S.fcm && S.fcm.on ? '' : 'on'}" data-act="push">${S.fcm && S.fcm.on ? 'إيقاف' : 'تفعيل'}</button></div>${isIOS() && !isStandalone() ? '<div class="m warn mt">على الآيفون لازم تضيف التطبيق للشاشة الرئيسية الأول.</div>' : ''}</div>
    ${S.admin ? '<button class="bt" data-act="admin">لوحة الإدارة</button>' : ''}
    <button class="bt red" data-act="logout" style="margin-top:auto">تسجيل الخروج</button></div>`;
}
function vAdmin() {
  return `<div class="h"><div><b>الإدارة</b><div class="m">${N(S.users.length)} مسجل</div></div><button class="bt" data-act="nav" data-v="account">رجوع</button></div>
  <div style="padding:0 16px 10px"><input class="in" data-in="usearch" placeholder="ابحث باسم المستخدم" aria-label="بحث" value="${esc(S.uq)}"></div>
  <div class="f" id="ulist">${adminRows()}</div>`;
}
function adminRows() {
  const q = S.uq.trim().toLowerCase();
  const list = S.users.filter(u => !q || (u.username || '').toLowerCase().includes(q)).sort((a, b) => (a.username || '').localeCompare(b.username || ''));
  return list.map(u => `<div class="k r ${u.banned ? 'dz' : ''}"><div class="av">${initial(u.username)}</div><div class="g"><div class="nm">${esc(u.username)}</div><div class="sub">${u.createdAt ? 'من ' + fmtDay(tsMs(u.createdAt)) : ''}</div></div><span class="pl ${u.banned ? 'bad' : 'ok'}">${u.banned ? 'محظور' : 'نشط'}</span><button class="bt ${u.banned ? '' : 'red'}" style="height:36px;padding:0 12px" data-act="ban" data-uid="${esc(u.id)}">${u.banned ? 'فك الحظر' : 'حظر'}</button></div>`).join('') || '<div class="k ctr">مفيش نتايج.</div>';
}

/* ───────── الأحداث ───────── */
const ACTIONS = {
  async google() {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (e) { if (!['auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(e.code)) toast(authMsg(e)); }
  },
  mode() { S.mode = S.mode === 'login' ? 'signup' : 'login'; S.authErr = ''; render(); },
  async reset() {
    const email = (document.querySelector('input[name=email]') || {}).value || '';
    if (!email.trim()) return toast('اكتب الإيميل الأول');
    try { await sendPasswordResetEmail(auth, email.trim()); toast('بعتنالك رابط تغيير كلمة السر على الإيميل'); }
    catch (e) { toast(authMsg(e)); }
  },
  async logout() { await flushSaves(); await signOut(auth); },
  retry() { S.view = 'loading'; render(); bootUser().then(render).catch(e => { console.error(e); S.view = 'error'; render(); }); },
  async nav(el) {
    const v = el.dataset.v;
    S.view = v;
    S.q = '';
    if (v === 'board') { render(); await Promise.all([loadBoard('total'), S.gw != null ? loadBoard('gw_' + S.gw) : null]); }
    else if (v === 'tour') { render(); await loadTours().catch(() => {}); }
    else if (v === 'stats') { initStats(); S.st.loading = true; render(); await loadStatsScope(); S.st.loading = false; }
    else if (v === 'account') { render(); await Promise.all([S.boards.total ? null : loadBoard('total').catch(() => {}), loadFcm()]); }
    else if (v === 'round') { await loadPicks().catch(() => {}); await loadMyPts(); }
    render();
  },
  async gw(el) { S.gw = Number(el.dataset.g); await Promise.all([loadPicks(), loadMyPts()]); chooseDay(); render(); },
  day(el) { S.day = el.dataset.k; render(); },
  async open(el) {
    const fid = el.dataset.fid;
    S.fx = fid; S.pos = 1; S.q = ''; S.save = '';
    S.view = 'loading'; render();
    try { await loadFixture(fid); S.view = 'match'; } catch (e) { console.error(e); toast('مقدرتش أفتح الماتش: ' + (e.code || e.message)); S.view = 'round'; }
    render();
  },
  back() { flushSaves(); S.view = 'round'; render(); },
  chip(el) { toggleChip(el.dataset.c); },
  async topen(el) { S.view = 'loading'; render(); try { await openTour(el.dataset.id); S.view = 'tdet'; } catch (e) { toast('مقدرتش أفتح البطولة'); S.view = 'tour'; } render(); },
  tback() { S.view = 'tour'; render(); },
  ttab(el) { S.tt.tab = el.dataset.k; render(); },
  tround(el) { S.tt.r = Number(el.dataset.r); render(); },
  async tnew() {
    S.tn = newTn(); S.view = 'tnew'; render();
    try {
      await loadUsersList();
      const c = await getDoc(doc(db, 'config', 'calendar')); S.cal = c.exists() ? c.data().days : [];
    } catch (e) { toast('مقدرتش أحمّل اللاعبين'); }
    render();
  },
  tcancel() { S.tn = null; S.view = 'tour'; render(); },
  tn(el) {
    const tn = S.tn, f = el.dataset.f, d = Number(el.dataset.d), c = tnCalc();
    if (f === 'groups') { tn.groups = Math.max(1, Math.min(tn.groups + d, Math.max(1, Math.floor(c.n / 2)))); tn.sizes = null; tn.custom = false; tn.rounds = null; }
    else if (f === 'rounds') tn.rounds = Math.max(1, Math.min(c.R + d, c.maxR || 1));
    else if (f === 'k') tn.k = Math.max(0, Math.min(tn.k + d, Math.min(...c.sizes)));
    else if (f === 'size') { const i = Number(el.dataset.i); tn.sizes = [...(tn.sizes || c.sizes)]; tn.sizes[i] = Math.max(1, tn.sizes[i] + d); }
    else if (f === 'start') {
      if (tn.scope === 'gw') tn.start = Math.max(1, Math.min(38, (c.start || 1) + d));
      else { const days = S.cal || [], i = days.findIndex(x => x.k === c.start); const j = Math.max(0, Math.min(days.length - 1, (i < 0 ? 0 : i) + d)); tn.start = days[j] && days[j].k; }
    }
    render();
  },
  tnlegs(el) { S.tn.legs = Number(el.dataset.v); S.tn.rounds = null; render(); },
  tnscope(el) { S.tn.scope = el.dataset.v; S.tn.start = null; render(); },
  tncustom() { const c = tnCalc(); S.tn.custom = !S.tn.custom; S.tn.sizes = S.tn.custom ? [...c.sizes] : null; render(); },
  tnall() { (S.users || []).filter(u => !u.banned).forEach(u => { S.tn.picked[u.id] = true; }); S.tn.sizes = null; render(); },
  tnclear() { S.tn.picked = {}; S.tn.sizes = null; render(); },
  tnp(el) { const u = el.dataset.u; S.tn.picked[u] = !S.tn.picked[u]; S.tn.sizes = null; S.tn.custom = false; render(); },
  async tndraw() { try { await createTour(false); } catch (e) { console.error(e); toast('مقدرتش أحفظ القرعة: ' + (e.code || e.message)); S.view = 'tnew'; } render(); },
  async tapprove() {
    try { await updateDoc(doc(db, 'tournaments', S.tour.id), { status: 'active' }); S.tour.t.status = 'active'; const x = S.tours.find(y => y.id === S.tour.id); if (x) x.status = 'active'; toast('البطولة اتعتمدت، الجداول هتظهر خلال ٥ دقايق'); }
    catch (e) { toast('مقدرتش أعتمدها: ' + (e.code || e.message)); }
    render();
  },
  async tredraw() {
    const t = S.tour.t, uids = Object.keys(t.players);
    const dr = makeDraw(t.cfg.sizes, t.cfg.legs, t.cfg.rounds, uids, cryptoRand);
    try { await updateDoc(doc(db, 'tournaments', S.tour.id), { groups: dr.groups, fixtures: dr.fixtures }); t.groups = dr.groups; t.fixtures = dr.fixtures; toast('اتعملت قرعة جديدة'); }
    catch (e) { toast('مقدرتش أعيد القرعة: ' + (e.code || e.message)); }
    render();
  },
  async tdel() {
    if (!confirm('تحذف البطولة دي؟')) return;
    try { await deleteDoc(doc(db, 'tournaments', S.tour.id)); try { await deleteDoc(doc(db, 'tstate', S.tour.id)); } catch (e) { /* مفيش حالة */ } S.tours = S.tours.filter(x => x.id !== S.tour.id); S.tour = null; S.view = 'tour'; toast('اتحذفت'); }
    catch (e) { toast('مقدرتش أحذفها: ' + (e.code || e.message)); }
    render();
  },
  push() { return (S.fcm && S.fcm.on) ? disablePush() : enablePush(); },
  ssc(el) { S.st.kind = el.dataset.k; refreshStats(); },
  sfx(el) { S.st.kind = 'match'; S.st.fid = el.dataset.fid; refreshStats(); },
  sday(el) { S.st.kind = 'day'; S.st.day = el.dataset.k; refreshStats(); },
  stab(el) { S.st.tab = el.dataset.k; S.st.q = ''; render(); },
  sx(el) { const k = el.dataset.k; S.st.ex[k] = !S.st.ex[k]; renderStatsBody(); },
  sopp(el) { S.st.opp = el.dataset.u; renderStatsBody(); },
  sopp0() { S.st.opp = null; S.st.oq = ''; renderStatsBody(); },
  steam(el) {
    const fid = S.fx, p = pickOf(fid);
    if (isLocked(fid)) return toast('الماتش بدأ، الاختيار مقفول');
    p.team = Number(el.dataset.t);
    changed(fid);
  },
  pos(el) { S.pos = Number(el.dataset.p); renderMatchBody(); },
  tp(el) {
    const fid = S.fx, d = S.fxdocs[fid], p = pickOf(fid), pid = Number(el.dataset.pid);
    if (isLocked(fid)) return toast('الماتش بدأ، الاختيار مقفول');
    const pl = d.players.find(x => x.i === pid);
    if (p.ids.includes(pid)) { p.ids = p.ids.filter(x => x !== pid); if (p.cap === pid) p.cap = null; }
    else {
      const why = canPick(d, p, pl); if (why) return toast(why);
      p.ids.push(pid);
      for (let i = 1; i <= 4; i++) {
        const q = ((S.pos - 1 + i) % 4) + 1;
        if (!p.ids.some(id => { const o = d.players.find(x => x.i === id); return o && o.p === q; })) { S.pos = q; break; }
      }
    }
    changed(fid);
  },
  cap(el, e) {
    e.stopPropagation();
    const fid = S.fx, p = pickOf(fid), pid = Number(el.dataset.pid);
    if (isLocked(fid)) return toast('الماتش بدأ، الاختيار مقفول');
    if (p.cap === pid) p.cap = null;
    else { if (capTakenElsewhere(fid)) return toast('اخترت كابتن في ماتش تاني النهاردة'); p.cap = pid; }
    changed(fid);
  },
  async bt(el) { S.bt = el.dataset.k; render(); const id = S.bt === 'total' ? 'total' : 'gw_' + S.gw; await loadBoard(id); render(); },
  async admin() {
    S.view = 'admin'; S.uq = ''; render();
    try { const s = await getDocs(collection(db, 'users')); S.users = s.docs.map(d => ({ id: d.id, ...d.data() })); }
    catch (e) { toast('مقدرتش أحمّل المستخدمين'); }
    render();
  },
  async ban(el) {
    const u = S.users.find(x => x.id === el.dataset.uid); if (!u) return;
    const to = !u.banned;
    if (!confirm((to ? 'تحظر ' : 'تفك الحظر عن ') + u.username + '؟')) return;
    try { await updateDoc(doc(db, 'users', u.id), { banned: to }); u.banned = to; const l = $('#ulist'); if (l) l.innerHTML = adminRows(); toast(to ? 'اتحظر' : 'اتفك الحظر'); }
    catch (e) { toast('مقدرتش أعدّل: ' + (e.code || e.message)); }
  }
};
const FORMS = {
  async login(f) {
    const email = f.elements.email.value.trim(), pw = f.elements.pw.value;
    S.email = email; S.authErr = '';
    try {
      if (S.mode === 'signup') await createUserWithEmailAndPassword(auth, email, pw);
      else await signInWithEmailAndPassword(auth, email, pw);
    } catch (e) { S.authErr = authMsg(e); render(); }
  },
  async setup(f) {
    const name = f.elements.u.value.trim(), low = name.toLowerCase();
    if (!/^[A-Za-z0-9_]{3,20}$/.test(name)) return toast('الاسم لازم ٣ لـ ٢٠ حرف إنجليزي أو رقم أو _');
    try {
      const t = await getDoc(doc(db, 'usernames', low));
      if (t.exists()) return toast('الاسم ده مستخدم، اختار غيره');
      const b = writeBatch(db);
      b.set(doc(db, 'usernames', low), { uid: S.user.uid });
      b.set(doc(db, 'users', S.user.uid), { username: name, usernameLower: low, photo: S.user.photoURL || null, banned: false, createdAt: serverTimestamp() });
      await b.commit();
      S.view = 'loading'; render();
      await bootUser();
    } catch (e) { console.error(e); toast(e.code === 'permission-denied' ? 'الاسم ده مستخدم أو مش مسموح' : 'مقدرتش أحفظ البروفايل'); S.view = 'setup'; }
    render();
  }
};
let unameTimer;
const INPUTS = {
  psearch(t) { S.q = t.value; renderList(); },
  tnname(t) { S.tn.name = t.value; },
  ssearch(t) { S.st.q = t.value; renderStatsBody(); },
  sopp(t) { S.st.oq = t.value; const l = $('#ol'); if (l) l.innerHTML = oppRows([...aggStats().users].filter(u => u !== S.profile.username).sort()); },
  usearch(t) { S.uq = t.value; const l = $('#ulist'); if (l) l.innerHTML = adminRows(); },
  uname(t) {
    const v = t.value.trim(), h = $('#uhint');
    clearTimeout(unameTimer);
    if (!/^[A-Za-z0-9_]{3,20}$/.test(v)) { h.className = 'm'; h.textContent = 'حروف إنجليزي وأرقام و_ فقط، من ٣ لـ ٢٠.'; return; }
    h.textContent = 'بنشوف لو متاح…';
    unameTimer = setTimeout(async () => {
      try { const s = await getDoc(doc(db, 'usernames', v.toLowerCase())); h.className = s.exists() ? 'err' : 'm'; h.textContent = s.exists() ? 'الاسم ده مستخدم' : 'متاح ✓'; }
      catch (e) { h.textContent = ''; }
    }, 400);
  }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act](el, e); });
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (f) { e.preventDefault(); FORMS[f.dataset.form](f); } });
document.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.in && INPUTS[t.dataset.in]) INPUTS[t.dataset.in](t); });

/* ───────── البداية ───────── */
onAuthStateChanged(auth, async u => {
  S.user = u;
  if (!u) { S.profile = null; S.admin = false; S.picks = {}; S.stats = {}; S.scores = {}; S.st = newSt(); S.fcm = null; S.tours = []; S.tour = null; S.tn = null; S.view = 'login'; render(); return; }
  S.view = 'loading'; render();
  try { await bootUser(); } catch (e) { console.error(e); S.view = 'error'; }
  render();
});
setInterval(() => { if (S.view === 'round' && lockSig() !== lastSig) render(); }, 30000);
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
