}

function defaultGw() {
  const nums = gwNums(), now = Date.now();
  const live = nums.find(g => gwFixtures(g).some(f => koOf(f) && koOf(f) + END_AFTER > now));
  return live ?? nums[nums.length - 1];
}
function daysOf(g) {
  const map = {};
  gwFixtures(g).forEach(f => {
    const k = koOf(f);
    const key = k ? dayKey(k) : 'tbd';
    (map[key] = map[key] || { key, ms: k, label: k ? fmtDay(k) : 'مواعيد لسه مش معروفة', list: [] }).list.push(f);
  });
  return Object.values(map).sort((a, b) => a.key.localeCompare(b.key)).map(d => {
    d.list.sort((a, b) => (koOf(a) || 9e15) - (koOf(b) || 9e15));
    return d;
  });
}

function canPick(fx, p, pl) {
  const five = p5On(S.fx);   // لاعب خامس (المحل): ٥ لاعبين، مركز واحد يتكرر، و٣ من فريق
  if (p.ids.length >= (five ? 5 : 4)) return five ? 'اخترت ٥ لاعبين بالفعل' : 'اخترت ٤ لاعبين بالفعل';
  const of = id => fx.players.find(x => x.i === id);
  if (p.chip !== 'free_pos' && p.ids.some(id => { const o = of(id); return o && o.p === pl.p; })) {
    const pos = {}; p.ids.forEach(id => { const o = of(id); if (o) pos[o.p] = (pos[o.p] || 0) + 1; });
    if (!five || Object.values(pos).some(n => n > 1)) return five ? 'كررت مركز قبل كده، مركز واحد بس ممكن يتكرر' : 'مركز ' + POS[pl.p] + ' مختار بالفعل، شيله الأول';
  }
  const same = p.ids.filter(id => { const o = of(id); return o && o.t === pl.t; }).length;
  if (p.chip !== 'free_team' && same >= (five ? 3 : 2)) return five ? 'مينفعش أكتر من ٣ من نفس الفريق' : 'مينفعش أكتر من لاعبين من نفس الفريق';
  return null;
}
/* الاختيار سليم بقواعد الخاصية دي؟ (chip = null يعني القواعد العادية) */
function validIds(fx, ids, chip, five) {
  if (new Set(ids).size !== ids.length) return false;   // نفس اللاعب مرتين ممنوع
  const pos = {}, team = {};
  let dup = 0;
  for (const id of ids) {
    const o = fx.players.find(x => x.i === id);
    if (!o) return false;
    pos[o.p] = (pos[o.p] || 0) + 1; team[o.t] = (team[o.t] || 0) + 1;
    if (chip !== 'free_pos' && pos[o.p] > 1) dup++;
    if (chip !== 'free_team' && team[o.t] > (five ? 3 : 2)) return false;
  }
  return dup <= (five ? 1 : 0) && ids.length <= (five ? 5 : 4);
}

function tnCalc() {

  const g = Math.max(1, tn.groups);
  const sizes = (tn.custom && tn.sizes && tn.sizes.length === g) ? tn.sizes : evenSizes(n, g);
  const maxR = maxRounds(sizes, tn.legs), R = Math.max(1, Math.min(tn.rounds ?? maxR, maxR || 1));
  const minSize = Math.min(...sizes), k = Math.min(tn.k, minSize);
  const K = koCount(sizes, k);
  const start = tn.start ?? (tn.scope === 'gw' ? (S.gw || 1) : ((S.cal || []).find(d => d.k >= dayKey(Date.now())) || {}).k);
  let err = '';

  else if (minSize < 2) err = 'كل مجموعة لازم فيها لاعبين على الأقل';

function normStats(sd) {

  if (!names) {

    Object.keys(sd.byUser || {}).forEach(n => { const uid = (sd.uidOf && sd.uidOf[n]) || ('n:' + n); users[uid] = sd.byUser[n]; names[uid] = n; });
  }

}

/* حساب نقط اختيار واحد في ماتش */
function calcPick(fid, p) {
  const d = S.fxdocs[fid], sc = S.scores[fid] || { pts: {}, status: 'ns' };
  const list = p.ids.map(id => d.players.find(x => x.i === id)).filter(Boolean).sort((a, b) => a.p - b.p);
  const base = list.reduce((s, pl) => s + (sc.pts[pl.i] || 0), 0);
  const cap = p.cap != null ? (sc.pts[p.cap] || 0) * (CAP_MULT - 1) : 0;
  let steal = 0;
  if (p.chip === 'steal' && p.team != null && sc.status === 'ft') steal = Math.max(0, ...d.players.filter(x => x.t === p.team).map(x => sc.pts[x.i] || 0));
  const xb = p.xb || 0;   // نقط المحل الزيادة (من Code.gs)
  return { d, sc, list, base, cap, steal, xb, total: base + cap + steal + xb };
}

function aggStats() {
  const A = { n: 0, picks: {}, caps: {}, chips: [], pairs: {}, combos: [], users: new Set() };
  scopeFx().forEach(f => {
    const sd = S.stats[f.id]; if (!sd) return;
    Object.keys(sd.users).forEach(u => {
      if (S.gone.has(u)) return;
      const p = sd.users[u]; A.n++; A.users.add(u);
      p.ids.forEach(id => { const k = f.id + ':' + id; (A.picks[k] = A.picks[k] || { fid: f.id, id, users: [] }).users.push(u); });
      if (p.cap != null) { const k = f.id + ':' + p.cap; (A.caps[k] = A.caps[k] || { fid: f.id, id: p.cap, users: [] }).users.push(u); }
      if (p.chip) A.chips.push({ u, chip: p.chip, fid: f.id, team: p.team });
      const ids = [...p.ids].sort((a, b) => a - b);
      for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
        const k = f.id + ':' + ids[i] + '_' + ids[j];
        (A.pairs[k] = A.pairs[k] || { fid: f.id, a: ids[i], b: ids[j], users: [] }).users.push(u);

/* ترتيب اللاعبين: بالملكية أو بالنقاط (الاتنين بيظهروا دايماً، والفرز بيغيّر الترتيب بس) */

/* العناية المركزة: مين نسي إيه، ومين وقع في إيه */
const CARE = { badCap: 2, weakSteal: 5, wrongTeamMin: 3 };   // كابتن فاشل: نقطتين أو أقل · هلقط رزقي ضعيف: بونص ٥ نقط أو أقل · الفريق الغلط: الفرق ٣ نقط أو أكتر
const timesAr = c => c === 1 ? 'مرة واحدة' : c === 2 ? 'مرتين' : N(c) + (c <= 10 ? ' مرات' : ' مرة');
const FLAG_N = { i: 'مصاب', s: 'موقوف', u: 'غير متاح', n: 'غير متاح' };
function careHtml() {
  const roster = activeIds(), w = scopeWord();
  if (!roster.length) return '<div class="k ctr">مفيش لاعبين لسه.</div>';
  const fxs = scopeFx().filter(f => S.stats[f.id] && S.fxdocs[f.id]);
  /* الاختيارات الفعلية بعد قواعد الحساب (الكابتن والخواص المحسوبة بس) */
  const allFx = startedFx(S.gw), eff = {};
  roster.forEach(u => { eff[u] = {}; effPicks(u, allFx).forEach(it => { eff[u][it.f.id] = it; }); });
  const tmpPill = live => live ? ' <span class="pl" style="font-size:10px">مؤقت</span>' : '';
  /* hits: كل واحد ظهر في كام سطر غلط (للملخص اللي فوق) */
  const hits = {}; let counting = true;
  const capLoss = {}; let capLossLive = false;   // مجموع النقط اللي ضاعت من الكابتن الغلط
  const rep = {};   // rep[يوم][لاعب][مركز] = عدد الماتشات اللي نسي فيها المركز ده
  const count = (uids, good) => { if (counting && !good) uids.forEach(u => { hits[u] = (hits[u] || 0) + 1; }); };
  /* noCount: سطر بيكرر غلطة اتعدت في سطر تاني (زي «نسوا مركزين») */
  const row = (key, label, uids, notes, live, good, noCount) => (count(uids, good || noCount), '') + `<div data-act="sx" data-k="${key}" style="cursor:pointer;padding:8px 0;border-top:1px solid rgba(255,255,255,.18)"><div class="r j"><span class="g nm" style="font-size:13px">${label}${tmpPill(live)}</span><span class="pl${good ? '' : ' bad'}">${N(uids.length)}</span></div>${S.st.ex[key] ? nameList(uids, notes) : ''}</div>`;
  const group = (title, rows) => { rows = rows.filter(Boolean); return rows.length ? `<div class="m" style="margin-top:10px;font-weight:700;color:#ffd45c">${title}</div>${rows.join('')}` : ''; };
  const intro = `<div class="m">مين نسي إيه ومين وقع في إيه في ${w} (بعد بداية الماتش). اضغط على أي سطر تشوف الأسماء.</div>`;
  let html = '';

  fxs.forEach(f => {
    const sd = S.stats[f.id], d = S.fxdocs[f.id], sc = S.scores[f.id] || { pts: {}, st: {}, status: 'ns' };
    const ft = sc.status === 'ft', live = !ft, pts = id => (sc.pts && sc.pts[id]) || 0;
    const pl = id => d.players.find(x => x.i === id);
    const pn = id => { const o = pl(id); return o ? o.n : '؟'; };
    const per = {};
    roster.forEach(uid => {
      const p = sd.users[uid], ids = p ? p.ids : [];
      if (!ids.length) { per[uid] = { none: true, miss: [1, 2, 3, 4] }; return; }
      if (p.chip === 'free_pos') { per[uid] = { none: false, miss: Array(Math.max(0, 4 - ids.length)).fill(0) }; return; }
      const have = new Set(ids.map(id => (pl(id) || {}).p));
      per[uid] = { none: false, miss: [1, 2, 3, 4].filter(pos => !have.has(pos)) };
    });
    const played = roster.filter(u => !per[u].none);
    const label = pos => POS[pos] || 'لاعب (أي مركز)';
    const notesFor = uids => { const o = {}; uids.forEach(u => { o[u] = per[u].miss.map(p => POS[p] || 'لاعب').join('، '); }); return o; };
    const byPos = [1, 2, 3, 4, 0].map(pos => ({ pos, uids: played.filter(u => per[u].miss.includes(pos)) })).filter(x => x.uids.length);
    const grp = n => played.filter(u => per[u].miss.length === n);
    const none = roster.filter(u => per[u].none), g2 = grp(2), g3 = grp(3);
    const K = x => x + f.id;
    const dk = dayKey(koOf(f)); rep[dk] = rep[dk] || {};
    played.forEach(u => per[u].miss.filter(pos => pos > 0).forEach(pos => { const r = rep[dk][u] = rep[dk][u] || {}; r[pos] = (r[pos] || 0) + 1; }));

    /* اللعيبة: مصاب/موقوف، دكة، سالب */
    const inj = {}, bench = {}, neg = {};
    played.forEach(u => {
      const ids = sd.users[u].ids;
      if (sd.flags) { const l = ids.filter(id => sd.flags[id]).map(id => pn(id) + ' (' + FLAG_N[sd.flags[id]] + ')'); if (l.length) inj[u] = l.join('، '); }
      if (ft && sc.st && Object.keys(sc.st).length) { const l = ids.filter(id => sc.st[id] !== 1 && pts(id) === 0).map(pn); if (l.length) bench[u] = l.join('، '); }
      const ng = ids.filter(id => pts(id) < 0).map(id => pn(id) + ' ' + N(pts(id))); if (ng.length) neg[u] = ng.join('، ');
    });

    /* الكابتن: فاشل، وغلط (فيه لاعب في تشكيلته جاب أكتر) */
    const badCap = {}, wrongCap = {};
    played.forEach(u => {
      const it = eff[u][f.id]; if (!it || it.invalid || it.p.cap == null) return;
      const cp = pts(it.p.cap);
      if (cp <= CARE.badCap) badCap[u] = pn(it.p.cap) + ' جاب ' + N(cp);
      const best = it.p.ids.reduce((b, id) => pts(id) > pts(b) ? id : b, it.p.cap);
      if (pts(best) > cp) { const loss = (pts(best) - cp) * (CAP_MULT - 1);
        wrongCap[u] = 'اختار ' + pn(it.p.cap) + ' كابتن بدل ' + pn(best) + ' · خسر ' + N(loss);
        capLoss[u] = (capLoss[u] || 0) + loss; if (live) capLossLive = true; }
    });

    /* هلقط رزقي: بونص ضعيف، والفريق الغلط */
    const weak = {}, wrongTeam = {};
    if (ft) played.forEach(u => {
      const it = eff[u][f.id]; if (!it || it.invalid || it.p.chip !== 'steal' || it.p.team == null) return;
      const topOf = tid => Math.max(0, ...d.players.filter(x => x.t === tid).map(x => pts(x.i)));
      const mine = topOf(it.p.team), other = it.p.team === d.h.id ? d.a : d.h, theirs = topOf(other.id);
      if (mine <= CARE.weakSteal) weak[u] = 'البونص ' + N(mine);
      if (theirs - mine >= CARE.wrongTeamMin) wrongTeam[u] = 'كان ' + teamName(other) + ' هيجيب ' + N(theirs) + ' بدل ' + N(mine) + ' · خسر ' + N(theirs - mine);
    });

    /* قاع الماتش، والنجم اللي محدش شافه */
    const tot = {}; played.forEach(u => { const it = eff[u][f.id]; tot[u] = it ? it.c.total : 0; });
    const vals = [...new Set(Object.values(tot))].sort((a, b) => a - b);

    const stars = top > 0 ? d.players.filter(x => pts(x.i) === top) : [];
    const sawStar = stars.length ? played.filter(u => stars.some(x => sd.users[u].ids.includes(x.i))) : [];
    const starName = stars.map(x => x.n).join(' و');
    const capStar = played.filter(u => { const it = eff[u][f.id]; return it && !it.invalid && it.p.cap != null && stars.some(x => x.i === it.p.cap); });

    const ks = o => Object.keys(o);
    const body = [
      group('التشكيلة', [
        ...byPos.map(x => row(K('cp' + x.pos + ':'), 'نسوا ' + label(x.pos), x.uids)),
        g2.length ? row(K('c2'), 'نسوا مركزين', g2, notesFor(g2), false, false, true) : '',
        g3.length ? row(K('c3'), 'نسوا ٣ مراكز', g3, notesFor(g3), false, false, true) : '',
        none.length ? row(K('c4'), 'ما اختاروش خالص', none) : ''
      ]),
      group('اللعيبة', [
        ks(inj).length ? row(K('ci'), 'اختاروا لاعب مصاب أو موقوف', ks(inj), inj) : '',
        ks(bench).length ? row(K('cb'), 'لعيبة قعدوا دكة وجابوا صفر', ks(bench), bench) : '',
        ks(neg).length ? row(K('cn'), 'لاعب جاب سالب', ks(neg), neg, live) : ''
      ]),
      group('الكابتن', [
        ks(badCap).length ? row(K('cf'), 'كابتن فاشل (' + N(CARE.badCap) + ' نقط أو أقل)', ks(badCap), badCap, live) : '',
        ks(wrongCap).length ? row(K('cw'), 'كابتن غلط', ks(wrongCap), wrongCap, live) : ''
      ]),
      group('هلقط رزقي', [
        ks(weak).length ? row(K('sw'), 'البونص كان ضعيف (' + N(CARE.weakSteal) + ' نقط أو أقل)', ks(weak), weak) : '',
        ks(wrongTeam).length ? row(K('st'), 'لقط من الفريق الغلط', ks(wrongTeam), wrongTeam) : ''
      ]),
      group('النتيجة', [
        bottom.length ? row(K('bt'), 'قاع الماتش', bottom, bottomNotes, live) : '',
        stars.length ? (sawStar.length ? row(K('ms'), 'شافوا النجم: ' + esc(starName) + ' (' + N(top) + ')', sawStar, null, live, true) : `<div class="m" style="padding:8px 0;border-top:1px solid rgba(255,255,255,.18)">النجم ${esc(starName)} (${N(top)}): محدش شافه</div>`) : '',

    html += `<div class="k"><div class="r j"><b>${esc(fxTitle(f))}</b><span class="m">${ft ? 'انتهى' : 'شغال'}</span></div>${body || '<div class="m mt">الكل تمام في الماتش ده ✓</div>'}${!ft ? '<div class="m mt">الدكة وهلقط رزقي بيظهروا بعد نهاية الماتش.</div>' : ''}</div>`;
  });
  if (!fxs.length) html += '<div class="k ctr">لسه مفيش إحصائيات جاهزة في النطاق ده.</div>';

  /* نسوا الكابتن: لكل يوم ماتشاته كلها بدأت */
  const capRows = [...new Set(fxs.map(f => dayKey(koOf(f))))].sort().map(dk => {
    const dayAll = gwFixtures(S.gw).filter(f => koOf(f) && dayKey(koOf(f)) === dk);
    const started = dayAll.every(f => allFx.some(x => String(x.id) === String(f.id)));
    const label = 'يوم ' + fmtDay(Date.parse(dk + 'T12:00:00Z'));
    if (!started) return `<div class="m" style="padding:8px 0;border-top:1px solid rgba(255,255,255,.18)">${esc(label)}: بيظهر بعد ما كل ماتشات اليوم تبدأ.</div>`;

  /* الكروت اللي جاية بتلخص اللي فوق، فمش بتتعد تاني في الملخص */
  counting = false;

  /* سطر ترتيب: الأسماء مترتبة من الأكتر للأقل */
  const rankRow = (key, label, map, fmt, live) => {

  }

}

/* ترتيب ماتش واحد بنفس قواعد الحساب الرسمية (أول خاصيتين في الجولة، وكابتن واحد في اليوم) */
function matchRanking(fid) {

/* تشكيلة لاعب في الجولة أو في ماتش: بنطبّق نفس قواعد الحساب (أول خاصيتين، وكابتن واحد في اليوم) */
function effPicks(uid, fxs) {
  const list = fxs.filter(f => S.stats[f.id] && S.stats[f.id].users[uid] && S.fxdocs[f.id]).sort((a, b) => koOf(a) - koOf(b));
  const used = {}; let nUsed = 0; const capDay = {};
  return list.map(f => {
    const p = { ...S.stats[f.id].users[uid] };
    const sc0 = S.scores[f.id];
    p.xb = (sc0 && sc0.xb && sc0.xb[uid]) || 0;   // نقط المحل الزيادة
    let chip = p.chip, dc = false, dcap = false, wasNew = false;
    if (chip) {
      const extra = (p.it === 'chip3' && !used[chip]) || (p.it === 'dup' && used[chip]);   // خاصية تالتة / مكررة (المحل)
      if ((!extra && (used[chip] || nUsed >= MAX_CHIPS)) || (chip === 'steal' && p.team !== f.h.id && p.team !== f.a.id)) { chip = null; dc = true; }
      else { wasNew = !used[chip]; if (wasNew) nUsed++; used[chip] = true; }
    }
    let cap = p.cap;
    if (cap != null) { const dk = dayKey(koOf(f)); if ((capDay[dk] || 0) >= (p.it === 'dcap' ? 2 : 1)) { cap = null; dcap = true; } else capDay[dk] = (capDay[dk] || 0) + 1; }
    const eff = { ...p, chip, cap, team: chip ? p.team : null };
    /* زي Code.gs: لو الخاصية اتشالت والتشكيلة مخالفة للقواعد العادية، الماتش كله ما يتحسبش */
    if (!validIds(S.fxdocs[f.id], p.ids, chip, p.it === 'p5')) {
      if (chip && wasNew) { used[chip] = false; nUsed--; }

/* صورة البروفايل: بتتصغّر وبتتخزن جوه مستند المستخدم، ومينفعش تتغيّر قبل ٣٠ يوم */
async function makeThumb(file) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const sz = Math.min(img.width, img.height), sx = (img.width - sz) / 2, sy = (img.height - sz) / 2;
  for (const [side, q] of [[192, 0.82], [160, 0.76], [128, 0.7], [96, 0.65]]) {
    const c = document.createElement('canvas'); c.width = c.height = side;
    c.getContext('2d').drawImage(img, sx, sy, sz, sz, 0, 0, side, side);
    const url = c.toDataURL('image/jpeg', q);
    if (url.length < 40000) return url;
  }
  throw new Error('الصورة كبيرة');
}
async function changePhoto(file) {

  if (!confirm('هتقدر تغيّر صورتك تاني بعد ٣٠ يوم. تكمل؟')) return;
  try {
    const thumb = await (window.__mkThumb || makeThumb)(file);
    await updateDoc(doc(db, 'users', S.user.uid), { photo: thumb, photoAt: serverTimestamp() });

  for (let i = 0; i < fids.length; i += 30) parts.push(fids.slice(i, i + 30));
  const snaps = await Promise.all(parts.map(ids => getDocs(query(collection(db, 'preds'), where('uid', '==', S.user.uid), where('fid', 'in', ids)))));
  const m = {};
  snaps.forEach(s => s.docs.forEach(d => { const x = d.data(); m[x.fid] = { h: x.h, a: x.a, ans: x.ans || {}, boost: !!x.boost }; }));
  S.pr.preds = m;
}
async function loadPst() {
  const open = gwFixtures(S.gw).filter(f => koOf(f) && Date.now() < koOf(f));
  await Promise.all(open.map(async f => {
    try { const r = await getDoc(doc(db, 'pstats', String(f.id))); S.pr.pst[f.id] = r.exists() ? r.data() : { n: 0, dist: {} }; }
    catch (e) { S.pr.pst[f.id] = { n: 0, dist: {} }; }

}

async function loadAllPb() {
  const now = Date.now();
  const gs = gwNums().filter(g => gwFixtures(g).some(f => koOf(f) && koOf(f) <= now));
  await Promise.all(gs.map(g => {
    const b = S.pr.boards[g];

  const qs = (x.q || []).map((k, i) => tr(esc(PQ[k] ? PQ[k].s : k), '', '', esc(pqAnsLabel(k, (p.ans || {})[k], d)), row[6 + i])).join('');
  return ov(`<b style="font-size:20px">${x.st === 'live' ? 'النقط لحد دلوقتي' : 'النتيجة بالتفصيل'}</b>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) 54px 54px 56px" class="m"><span>البند</span><span class="ctr">النتيجة</span><span class="ctr">توقعك</span><span style="text-align:end">نقط</span></div>
    ${tr('الفايز', '', out(x.r), out([p.h, p.a]), row[1])}${tr('أهداف صاحب الأرض', '', x.r[0], p.h, row[2])}${tr('أهداف الضيف', '', x.r[1], p.a, row[3])}${tr('فارق الأهداف', '', x.r[0] - x.r[1], p.h - p.a, row[4])}${tr('النتيجة النادرة', 'بالظبط وأقل من ' + N(PRED.rarePct) + '٪ توقعوها', '', '', row[5])}${qs}
    ${row[8] ? `<div class="r j" style="min-height:40px"><span class="nm" style="color:#ffd45c">المعزز</span><b style="color:#ffd45c">×${N(PRED.boost)}</b></div>` : ''}${pItemLines(x, d)}
    <div class="k r j" style="font-weight:800;font-size:16px"><span>${x.st === 'live' ? 'المجموع المؤقت' : 'مجموع النقط'}</span><span>${row[0] ? '+' + N(row[0]) + ' نقطة' : 'مفيش نقط'}</span></div>`, 'pdetx');
}

/* سطور حاجة المحل في تفاصيل النقط (من pboard: fx.it[uid]) */
function pItemLines(x, d) {
  const it = x && x.it && x.it[S.user.uid]; if (!it) return '';
  const ln = (a, b) => `<div class="r j" style="min-height:36px"><span class="nm" style="color:#ffd45c">${a}</span><b style="color:#ffd45c">${b}</b></div>`;
  let h = ln(COIN + ' ' + esc(itemDef('p', it.c).n), '');
  if (it.c === 'dbl' && it.x2) h += ln('توقعك التاني ' + scoreHtml(it.x2[0], it.x2[1]), it.alt ? 'هو اللي اتحسب' : 'الأول أحسن');
  if (it.b) h += ln('النتيجة الذهبية', '+' + N(it.b));
  if (it.c === 'q3' && it.k3) h += ln(esc(PQ[it.k3] ? PQ[it.k3].s : it.k3) + ': ' + esc(pqAnsLabel(it.k3, it.v3, d)), it.q3 < 0 ? 'لسه' : '+' + N(Math.max(0, it.q3 || 0)));
  if (it.c === 'q2x') h += ln('نقط الأسئلة', '×٢');

  if (it.s) h += ln('شبكة الأمان', '+' + N(it.s));
  return h;
}

/* ───── توقعات اللاعبين (بعد القفل) ───── */
function vPpl() {
  const P = S.pr, fid = P.pp, f = fxInfo(fid), x = pFx(fid), pub = P.pub[fid], d = S.fxdocs[fid];

  const by = pub.byUser || {}, uids = Object.keys(by).filter(u => !S.gone.has(u));
  const cnt = {}; uids.forEach(u => { const k = by[u].h + '-' + by[u].a; cnt[k] = (cnt[k] || 0) + 1; });
  const dist = {}; Object.keys(cnt).forEach(k => { dist[k] = Math.round(cnt[k] / uids.length * 100); });

    ${rows.map(r => { const me = r.u === S.user.uid; return `<div class="k r" style="${me ? 'border-color:#2fd06b;background:rgba(47,208,107,.22)' : ''}">${avatar(photoOf(r.u), r.name)}<div class="g"><div class="nm">${esc(r.name)}${me ? ' (أنت)' : ''}${r.p.boost ? ' <span class="pl" style="background:#f5b301;color:#1a1300">×٢</span>' : ''}${r.p.it ? ' ' + itemPill('p', r.p.it.c) : ''}${r.p.it && r.p.it.x2 ? ' <span class="pl">التاني ' + r.p.it.x2[0] + '-' + r.p.it.x2[1] + '</span>' : ''}</div>${ans(r.p) ? `<div class="sub">${ans(r.p)}</div>` : ''}</div><b style="font-size:18px">${scoreHtml(r.p.h, r.p.a)}</b><span class="d" style="min-width:56px;text-align:end">${N(r.pts)}</span></div>`; }).join('') || '<div class="k ctr">محدش توقع الماتش ده.</div>'}

/* ───── الترتيب ───── */
const monthName = ym => { const [y, m] = ym.split('-').map(Number); return new Intl.DateTimeFormat('ar-EG', { month: 'long', timeZone: 'UTC' }).format(Date.UTC(y, m - 1, 15)); };
function pBoardHtml() {
  const P = S.pr, docs = gwNums().map(g => [g, P.boards[g]]).filter(e => e[1] && e[1].fx && Object.keys(e[1].fx).length);
  const gws = docs.map(e => e[0]), months = [...new Set(docs.map(e => e[1].month).filter(Boolean))].sort();
  const days = [...new Set(docs.flatMap(e => Object.values(e[1].fx).map(x => x.d)))].sort();
  const cur = gws.length ? gws[gws.length - 1] : null;
  if (P.bgw == null || !gws.includes(P.bgw)) P.bgw = cur;
  if (P.from == null || !gws.includes(P.from)) P.from = gws[0] ?? null;
  if (P.to == null || !gws.includes(P.to)) P.to = cur;
  if (P.month == null || !months.includes(P.month)) P.month = months[months.length - 1] ?? null;
  if (P.day == null || !days.includes(P.day)) P.day = days[days.length - 1] ?? null;
  const modes = [['total', 'الإجمالي'], ['gw', 'جولة'], ['range', 'من جولة لجولة'], ['month', 'شهر'], ['day', 'يوم']];
  let sub = '';
  if (P.bt === 'gw') sub = `<div class="tg">${gws.map(g => `<button class="bt ${g === P.bgw ? 'on' : ''}" style="flex:none" data-act="pbg" data-g="${g}">الجولة ${N(g)}</button>`).join('')}</div>`;
  if (P.bt === 'range') sub = `<div class="tg eq" style="align-items:center">${['from', 'to'].map(w => `<div class="k r j" style="flex:1;padding:4px"><button class="bt" style="width:40px;padding:0" data-act="pbr" data-w="${w}" data-d="-1" aria-label="أقدم">−</button><div class="ctr"><div class="m" style="font-size:10px">${w === 'from' ? 'من' : 'لحد'}</div><b style="font-size:13px">الجولة ${N(P[w] ?? 0)}</b></div><button class="bt" style="width:40px;padding:0" data-act="pbr" data-w="${w}" data-d="1" aria-label="أحدث">+</button></div>`).join('')}</div>`;
  if (P.bt === 'month') sub = `<div class="tg">${months.map(m => `<button class="bt ${m === P.month ? 'on' : ''}" style="flex:none" data-act="pbm" data-m="${m}">${esc(monthName(m))}</button>`).join('')}</div>`;
  if (P.bt === 'day') sub = `<div class="tg">${[...days].reverse().map(k => `<button class="bt ${k === P.day ? 'on' : ''}" style="flex:none;font-size:13px" data-act="pbd" data-k="${k}">${esc(fmtDay(Date.parse(k + 'T12:00:00Z')))}</button>`).join('')}</div>`;
  /* التجميع */
  const agg = {}; let live = false;
  if (P.bt === 'total') (P.total && P.total.rows || []).forEach(r => { agg[r.uid] = { pts: r.pts, ex: r.ex || 0, name: r.name }; });
  else docs.forEach(([g, b]) => {
    const okGw = P.bt === 'gw' ? g === P.bgw : P.bt === 'range' ? g >= P.from && g <= P.to : P.bt === 'month' ? b.month === P.month : true;
    if (!okGw) return;
    Object.values(b.fx).forEach(x => {
      if (P.bt === 'day' && x.d !== P.day) return;
      if (x.st === 'live') live = true;
      Object.keys(x.rows || {}).forEach(u => { const r = x.rows[u], o = agg[u] = agg[u] || { pts: 0, ex: 0 }; o.pts += r[0]; if (r[2] > 0 && r[3] > 0) o.ex++; });
    });
  });
  if (P.bt === 'total') live = docs.some(([, b]) => Object.values(b.fx).some(x => x.st === 'live'));
  const banned = new Set(S.userList.filter(u => u.banned).map(u => u.id));
  const list = Object.keys(agg).filter(u => !S.gone.has(u) && !banned.has(u)).map(u => ({ uid: u, name: S.names[u] || agg[u].name || nm(u), pts: agg[u].pts, ex: agg[u].ex }))
    .sort((a, b) => (b.pts - a.pts) || (b.ex - a.ex) || byName(a.name, b.name));
  let rank = 0, prev = null;
  list.forEach((r, i) => { if (!prev || r.pts !== prev.pts || r.ex !== prev.ex) rank = i + 1; r.rank = rank; prev = r; });
  const me = list.find(r => r.uid === S.user.uid);
  const scope = P.bt === 'total' ? 'من أول الموسم' : P.bt === 'gw' ? 'الجولة ' + N(P.bgw ?? 0) : P.bt === 'range' ? 'من الجولة ' + N(P.from ?? 0) + ' لحد الجولة ' + N(P.to ?? 0) : P.bt === 'month' ? (P.month ? 'شهر ' + monthName(P.month) : '') : (P.day ? fmtDay(Date.parse(P.day + 'T12:00:00Z')) : '');
  const ring = ['#f5b301', '#d0dde8', '#e0a070'];
  const pod = list.slice(0, 3).map((r, i) => `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0">${avatarL('p', r.uid, r.name, i ? 46 : 56)}<div class="nm" style="font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${decoName('p', r.uid, r.name)}</div><div class="k ctr" style="padding:6px;height:${i === 0 ? 92 : i === 1 ? 72 : 58}px;display:flex;flex-direction:column;justify-content:center;${r.uid === S.user.uid ? 'border-color:#2fd06b' : ''}"><div class="d" style="font-size:22px;color:${ring[i]}">${N(r.rank)}</div><div style="font-weight:700;font-size:13px">${N(r.pts)}</div></div></div>`);
  const podium = pod.length === 3 ? [pod[1], pod[0], pod[2]] : pod;
  return `<div class="tg">${modes.map(m => `<button class="bt ${P.bt === m[0] ? 'on' : ''}" style="flex:none" data-act="pbt" data-k="${m[0]}">${m[1]}</button>`).join('')}</div>${sub}
  <div class="f"><div class="r j m"><span>${esc(scope)}${me ? ' · مركزك ' + N(me.rank) + ' من ' + N(list.length) : ''}</span>${live ? '<span class="pl lv">فيه ماتش شغال · النقط مؤقتة</span>' : ''}</div>
  ${P.loading && !list.length ? '<div class="k ctr">جاري التحميل…</div>' : !list.length ? '<div class="k ctr">لسه مفيش نقط في الفترة دي.</div>' : `
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end">${podium.join('')}</div>
  ${list.slice(3).map(r => { const mine = r.uid === S.user.uid, bg = bgCss('p', r.uid), ds = decoSub('p', r.uid); return `<div class="k r" style="${bg ? bg + (mine ? 'border-color:#2fd06b' : '') : mine ? 'border-color:#2fd06b;background:rgba(47,208,107,.26)' : ''}"><span class="d" style="width:26px;text-align:center;color:#d0dde8">${N(r.rank)}</span>${avatarL('p', r.uid, r.name)}<div class="g"><div class="nm">${decoName('p', r.uid, r.name)}${mine ? ' (أنت)' : ''}</div><div class="sub">${ds ? ds + ' · ' : ''}${r.ex ? N(r.ex) + ' نتيجة مظبوطة' : 'مفيش نتايج مظبوطة'}</div></div><span class="d" style="font-size:20px">${N(r.pts)}</span></div>`; }).join('')}`}
  </div>`;
}

/* ───── الحفظ والمعزز ───── */
async function savePred() {
  const sh = S.pr.sheet, fid = String(sh.fid), d = S.fxdocs[fid];
  if (isLocked(fid)) { S.pr.sheet = null; render(); return toast('الماتش بدأ، التوقع اتقفل'); }
  const prev = S.pr.preds[fid], ans = {};
  (d.q || []).forEach(k => { if (sh.ans[k] != null) ans[k] = sh.ans[k]; });
  try {
    await setDoc(doc(db, 'preds', fid + '_' + S.user.uid), { uid: S.user.uid, gw: d.gw, fid, h: sh.h, a: sh.a, ans, boost: !!(prev && prev.boost), updatedAt: serverTimestamp() });
    S.pr.preds[fid] = { h: sh.h, a: sh.a, ans, boost: !!(prev && prev.boost) };
    /* بيانات المحل: النتيجة التانية أو إجابة السؤال التالت */
    const pit = myItem('p', fid);
    if (pit && pit.item === 'dbl') await setItemX(pit, { h: sh.h2, a: sh.a2 }).catch(e => { console.error(e); toast('مقدرتش أحفظ التوقع التاني'); });
    if (pit && pit.item === 'q3' && d.q3) await setItemX(pit, { v: sh.ans[d.q3] ?? null }).catch(e => { console.error(e); toast('مقدرتش أحفظ السؤال التالت'); });
    S.pr.sheet = null; toast('اتحفظ التوقع ✓'); render();
  } catch (e) { console.error(e); toast(e.code === 'permission-denied' ? 'الحفظ مرفوض: الماتش ممكن يكون بدأ أو حسابك محظور' : 'مقدرتش أحفظ، تأكد من النت'); }
}
async function togglePredBoost(fid) {
  const P = S.pr, p = P.preds[fid], uid = S.user.uid;
  if (!p) return toast('احفظ توقعك الأول');
  if (isLocked(fid)) return toast('الماتش بدأ');
  const inGw = new Set(gwFixtures(S.gw).map(f => String(f.id)));
  const other = Object.keys(P.preds).find(k => k !== fid && P.preds[k].boost && inGw.has(k) && kickoffOf(k));
  if (!p.boost && other && isLocked(other)) return toast('المعزز اتثبّت على ماتش بدأ في الجولة دي');
  const b = writeBatch(db);
  const put = (k, on) => { const x = P.preds[k]; b.set(doc(db, 'preds', k + '_' + uid), { uid, gw: S.gw, fid: k, h: x.h, a: x.a, ans: x.ans || {}, boost: on, updatedAt: serverTimestamp() }); };
  if (p.boost) put(fid, false);
  else { if (other) put(other, false); put(fid, true); }
  try {
    await b.commit();
    if (p.boost) p.boost = false; else { if (other) P.preds[other].boost = false; p.boost = true; }
    toast(p.boost ? 'المعزز ×٢ اتشغّل على الماتش ده' : 'اتلغى المعزز'); render();
  } catch (e) { console.error(e); toast('مقدرتش أغيّر المعزز'); }
}

/* ───── الأحداث ───── */
function bumpWheel(side, delta) {
  const sh = S.pr.sheet; if (!sh || sh.picker) return;
  sh[side] = Math.max(0, Math.min(9, sh[side] + delta)); renderSheet();
}
let whY = null, whK = null;
document.addEventListener('touchstart', e => { const w = e.target.closest && e.target.closest('[data-wheel]'); if (!w) return; whY = e.touches[0].clientY; whK = w.dataset.wheel; }, { passive: true });
document.addEventListener('touchend', e => {
  if (whK == null) return;
  const dy = e.changedTouches[0].clientY - whY, k = whK; whK = null;
  if (Math.abs(dy) < 18) return;
  bumpWheel(k, (dy < 0 ? 1 : -1) * Math.max(1, Math.round(Math.abs(dy) / 36)));
}, { passive: true });
Object.assign(ACTIONS, {
  noop() {},
  async ptab(el) { S.pr.tab = el.dataset.k; render(); if (S.pr.tab === 'b') { S.pr.loading = true; render(); await Promise.all([loadAllPb(), loadPtotal(), loadNames()]); S.pr.loading = false; render(); } },
  async pgw(el) { S.gw = Number(el.dataset.g); S.pr.open = {}; render(); await predLoad(); chooseDay(); render(); },
  async popen(el) {
    const fid = String(el.dataset.fid);
    if (isLocked(fid)) return toast('الماتش بدأ، التوقع اتقفل');
    const p = S.pr.preds[fid];
    S.pr.sheet = { fid, h: p ? p.h : 0, a: p ? p.a : 0, ans: Object.assign({}, (p && p.ans) || {}), picker: null };
    const pit = myItem('p', fid), px = (pit && pit.x) || {};
    if (pit && pit.item === 'dbl') { S.pr.sheet.h2 = Number.isInteger(px.h) ? px.h : 0; S.pr.sheet.a2 = Number.isInteger(px.a) ? px.a : 0; }
    renderSheet();
    try { await loadFixture(fid, false); } catch (e) { S.pr.sheet = null; toast('مقدرتش أفتح الماتش'); }
    const d3 = S.fxdocs[fid];
    if (S.pr.sheet && pit && pit.item === 'q3' && d3 && d3.q3 && px.v != null) S.pr.sheet.ans[d3.q3] = px.v;
    renderSheet();
  },
  pclose() { S.pr.sheet = null; renderSheet(); },
  pwh(el) { bumpWheel(el.dataset.k, Number(el.dataset.d)); },
  ppop(el) { const sh = S.pr.sheet; if (!sh) return; sh.h = Number(el.dataset.h); sh.a = Number(el.dataset.a); renderSheet(); },
  pq(el) { const sh = S.pr.sheet; if (!sh) return; const k = el.dataset.k, v = el.dataset.v; if (sh.ans[k] === v) delete sh.ans[k]; else sh.ans[k] = v; renderSheet(); },
  ppick(el) { const sh = S.pr.sheet; if (!sh) return; sh.picker = el.dataset.k; renderSheet(); const x = $('#psh .sh'); if (x) x.scrollTop = 0; },
  ppickx() { const sh = S.pr.sheet; if (!sh) return; sh.picker = null; renderSheet(); },
  pplayer(el) { const sh = S.pr.sheet; if (!sh || !sh.picker) return; const v = Number(el.dataset.pid); if (sh.ans[sh.picker] === v) delete sh.ans[sh.picker]; else sh.ans[sh.picker] = v; sh.picker = null; renderSheet(); },
  psave() { savePred(); },
  pboost(el) { togglePredBoost(String(el.dataset.fid)); },
  pinfo() { S.pr.info = true; renderSheet(); },
  pinfox() { S.pr.info = false; renderSheet(); },
  pexp(el) { const fid = String(el.dataset.fid); S.pr.open[fid] = !S.pr.open[fid]; render(); },
  async pdet(el) { const fid = String(el.dataset.fid); S.pr.dt = fid; try { await loadFixture(fid, false); } catch (e) { /* الأسماء بس */ } renderSheet(); },
  pdetx() { S.pr.dt = null; renderSheet(); },
  async ppl(el) { S.pr.pp = String(el.dataset.fid); S.view = 'ppl'; render(); await pplLoad(); render(); },
  async pplfx(el) { S.pr.pp = String(el.dataset.fid); render(); await pplLoad(); render(); },
  pback() { leaveSub(); S.view = 'pred'; render(); },
  pbt(el) { S.pr.bt = el.dataset.k; render(); },
  pbg(el) { S.pr.bgw = Number(el.dataset.g); render(); },
  pbm(el) { S.pr.month = el.dataset.m; render(); },
  pbd(el) { S.pr.day = el.dataset.k; render(); },

async function buyItem(cur, item, x, gw) {
  const uid = S.user.uid, def = itemDef(cur, item), price = def.p;
  const wr = await getDoc(doc(db, 'wallet', uid));
  if (!wr.exists()) throw new Error('nowallet');
  const w = wr.data(), have = (w['e' + cur] || 0) - (w['s' + cur] || 0);
  if (have < price) throw new Error('nobal');
  const n = (w.n || 0) + 1, upd = { n };
  upd['s' + cur] = (w['s' + cur] || 0) + price;
  const data = { uid, n, cur, item, k: isPtItem(item) ? 'pt' : 'cos', price, gw: gw ?? null, t: null, at: null, createdAt: serverTimestamp() };
  if (x) data.x = x;
  const b = writeBatch(db);
  b.update(doc(db, 'wallet', uid), upd);
  b.set(doc(db, 'buys', uid + '_' + n), data);
  await b.commit();
  S.shop.w = { ...w, ...upd };
  S.shop.buys.push({ id: uid + '_' + n, ...data, createdAt: Date.now() });
}

const PREF_DEF = { snd: true, fs: true };
const prefOn = k => { try { const v = localStorage.getItem('fd_' + k); return v == null ? PREF_DEF[k] : v === '1'; } catch (e) { return PREF_DEF[k]; } };
const setPref = (k, on) => { try { localStorage.setItem('fd_' + k, on ? '1' : '0'); } catch (e) { /* مش مهم */ } };

/* ───────── الأصوات (متولّدة بالكود، من غير ملفات) ───────── */
let actx = null;
function audio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume().catch(() => {});
    return actx;
  } catch (e) { return null; }
}
/* نغمة واحدة ناعمة: بتطلع وتختفي بسرعة من غير "طقّة" */
function tone(ctx, out, { f, f2, t = 0, d = .12, g = .1, type = 'sine' }) {
  const o = ctx.createOscillator(), v = ctx.createGain(), at = ctx.currentTime + t;
  o.type = type; o.frequency.setValueAtTime(f, at);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, at + d);
  v.gain.setValueAtTime(0.0001, at);
  v.gain.exponentialRampToValueAtTime(g, at + 0.006);
  v.gain.exponentialRampToValueAtTime(0.0001, at + d);
  o.connect(v); v.connect(out); o.start(at); o.stop(at + d + 0.02);
  return o;
}
/* أصوات من لينك (SOUND_LINKS فوق). بنحمّلها مرة واحدة ونشغّلها فوراً من الذاكرة.
   لو الموقع اللي عليه الملف مش سامح بالتحميل المباشر (CORS)، بنشغّله بطريقة تانية (Audio).
   ولو اللينك فاضي أو باظ، بيشتغل الصوت المتولّد بالكود. */
const sndBuf = {}, sndEl = {};
async function loadSound(k) {
  const L = SOUND_LINKS[k]; if (!L || !L.url || sndBuf[k] !== undefined) return;
  sndBuf[k] = null;
  const ctx = audio();
  try {
    if (!ctx) throw 0;
    const r = await fetch(L.url, { mode: 'cors', cache: 'force-cache' });
    if (!r.ok) throw 0;
    const data = await r.arrayBuffer();
    sndBuf[k] = await new Promise((res, rej) => ctx.decodeAudioData(data, res, rej));
  } catch (e) {
    const a = new Audio(); a.preload = 'auto'; a.src = L.url;
    a.addEventListener('canplaythrough', () => { sndEl[k] = a; }, { once: true });
    a.addEventListener('error', () => { console.warn('مقدرتش أحمّل صوت ' + k + ' من: ' + L.url); }, { once: true });
    a.load();
  }
}
function playFile(k) {
  const L = SOUND_LINKS[k], ctx = audio(), b = sndBuf[k];
  if (ctx && b) {
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = b; g.gain.value = L.vol;
    src.connect(g); g.connect(ctx.destination); src.start();
    return true;
  }
  if (sndEl[k]) {
    const a = sndEl[k].cloneNode(); a.volume = Math.min(1, L.vol);
    a.play().catch(() => {});
    return true;
  }
  return false;
}
/* صوت الضغطة: "توك" خفيف وواطي */
function clickSound() {
  if (!prefOn('snd')) return;
  const ctx = audio(); if (!ctx || ctx.state !== 'running') return;
  if (playFile('click')) return;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800; lp.connect(ctx.destination);
  tone(ctx, lp, { f: 760, f2: 430, d: .075, g: .05 });
  tone(ctx, lp, { f: 1520, f2: 900, d: .04, g: .012 });
}
/* صوت الدخول: خبطة كورة، صفارة حكم قصيرة، وأكورد بيعلى مع همهمة جمهور */
function introSound() {
  if (!prefOn('snd')) return;
  const ctx = audio(); if (!ctx) return;
  if (playFile('intro')) return;
  const m = ctx.createGain(); m.gain.value = .55;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
  m.connect(lp); lp.connect(ctx.destination);
  tone(ctx, m, { f: 150, f2: 45, d: .22, g: .5 });                       // الكورة
  [[.12, .09], [.26, .16]].forEach(([t, d]) => {                          // الصفارة
    const o = tone(ctx, m, { f: 2650, t, d, g: .07 });
    const l = ctx.createOscillator(), lg = ctx.createGain();
    l.frequency.value = 38; lg.gain.value = 70; l.connect(lg); lg.connect(o.frequency);
    l.start(ctx.currentTime + t); l.stop(ctx.currentTime + t + d + .02);
  });
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(ctx, m, { f, t: .5 + i * .085, d: .9 - i * .1, g: .12, type: 'triangle' }));   // الأكورد
  tone(ctx, m, { f: 261.63, t: .5, d: 1.1, g: .1, type: 'triangle' });
  const len = 1.4, buf = ctx.createBuffer(1, ctx.sampleRate * len, ctx.sampleRate), ch = buf.getChannelData(0);   // الجمهور
  for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  const n = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), ng = ctx.createGain(), at = ctx.currentTime + .45;
  n.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = .7;
  ng.gain.setValueAtTime(0.0001, at); ng.gain.exponentialRampToValueAtTime(.09, at + .5); ng.gain.exponentialRampToValueAtTime(0.0001, at + len - .05);
  n.connect(bp); bp.connect(ng); ng.connect(m); n.start(at); n.stop(at + len);
}
document.addEventListener('click', e => {
  if (e.target.closest('#intro')) return;
  const el = e.target.closest('button,[data-act],label.bt,a');
  if (el && !el.disabled) clickSound();
}, true);

/* ───────── ملء الشاشة ───────── */
const fsSupported = () => !!(document.fullscreenEnabled && document.documentElement.requestFullscreen);
let fsTried = false;
function goFullscreen(force) {
  if (!prefOn('fs') || isStandalone() || !fsSupported() || document.fullscreenElement) return;
  if (fsTried && !force) return;
  fsTried = true;
  document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
}
/* المتصفح بيسمح بملء الشاشة بعد ضغطة بس، فبنجربه مع أول ضغطة */
document.addEventListener('pointerup', () => goFullscreen(false), { once: true });

/* ───────── شاشة الدخول ───────── */
function showIntro() {
  const el = document.createElement('div');
  el.id = 'intro'; el.setAttribute('role', 'button'); el.setAttribute('aria-label', 'ادخل');
  el.innerHTML = `<div class="il"></div><svg class="ir" viewBox="0 0 250 250" aria-hidden="true"><circle cx="125" cy="125" r="120"/></svg>
    <div class="iw"></div><div class="ib">${BALL}</div><img class="ilg" src="icon-192.png" alt="">
    <div class="itx"><div class="itt">Mido’s Fantasy</div><div class="its">اختار ٤ لاعبين من كل ماتش ونافس واثبتلهم انك التوب</div><div class="igo"><button class="bt on" type="button">يلا ندخل</button></div></div>`;
  document.body.appendChild(el);
  let done = false;
  const go = () => {
    if (done) return; done = true;
    goFullscreen(true);
    if (!played) introSound();
    el.classList.add('out');
    setTimeout(() => el.remove(), 550);
  };
  /* لو المتصفح سامح بالصوت من غير ضغطة، الشاشة بتكمّل لوحدها. غير كده بيظهر زرار "يلا ندخل" والصوت يشتغل معاه */
  const ctx = prefOn('snd') ? audio() : null;
  if (ctx) { loadSound('click'); loadSound('intro'); }
  const auto = !prefOn('snd') || (ctx && ctx.state === 'running');
  let played = false;
  if (auto && prefOn('snd')) setTimeout(() => { if (!done) { played = true; introSound(); } }, 1350);   // مع نزول الكورة
  setTimeout(() => { if (done) return; if (auto) go(); else el.classList.add('tap'); }, auto ? 2900 : 2300);
  setTimeout(() => el.addEventListener('click', go), 300);
}
showIntro();
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
