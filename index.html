}
function bindForeground() {

}

async function refreshPush() {

    if (!pushConfigured() || !(await isSupported()) || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    await loadFcm();
    if (!S.fcm || !S.fcm.on) return;
    bindForeground();
    const t = await pushToken();
    if (t && t !== S.fcm.token) { await setDoc(doc(db, 'fcm', S.user.uid), { token: t, on: true, updatedAt: serverTimestamp() }); S.fcm = { token: t, on: true }; }
  } catch (e) { console.error(e); }
}
async function enablePush() {
  if (!pushConfigured()) return toast('التنبيهات لسه مش جاهزة، الإدارة محتاجة تضيف مفتاح التنبيهات');
  if (isIOS() && !isStandalone()) return toast('على الآيفون ضيف التطبيق للشاشة الرئيسية الأول (مشاركة ثم Add to Home Screen) وافتحه منها');
  try {
    if (!(await isSupported())) return toast('المتصفح ده مش بيدعم التنبيهات');
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast('لازم توافق على الإشعارات من إعدادات المتصفح');
    const token = await pushToken();
    if (!token) return toast('مقدرتش أجيب توكن التنبيهات');
    await setDoc(doc(db, 'fcm', S.user.uid), { token, on: true, updatedAt: serverTimestamp() });
    S.fcm = { token, on: true };
    bindForeground();
    toast('اتفعّلت التنبيهات ✓');
  } catch (e) { console.error(e); toast('مقدرتش أفعّل التنبيهات: ' + (e.code || e.message)); }
  render();
}

}

/* ───────── الإحصائيات والمقارنة ───────── */
const startedFx = g => gwFixtures(g).filter(f => koOf(f) && Date.now() >= koOf(f) + 120000).sort((a, b) => koOf(a) - koOf(b));
const fxTitle = f => teamName(f.h) + ' ضد ' + teamName(f.a);
function scopeFx() {
  const st = S.st, all = S.gw != null ? startedFx(S.gw) : [];
  if (st.kind === 'match') return all.filter(f => String(f.id) === String(st.fid));
  if (st.kind === 'day') return all.filter(f => dayKey(koOf(f)) === st.day);
  return all;
}
const scopeWord = () => ({ match: 'الماتش', day: 'اليوم', gw: 'الجولة' })[S.st.kind];
function scopeLabel() {
  const st = S.st, fx = scopeFx(), n = fx.length, cnt = n === 1 ? 'ماتش واحد' : N(n) + ' ماتشات';
  if (st.kind === 'match') return fx[0] ? 'ماتش ' + fxTitle(fx[0]) : 'ماتش معين';
  if (st.kind === 'day') return 'يوم ' + fmtDay(Date.parse(st.day + 'T12:00:00Z')) + ' · ' + cnt;
  return 'الجولة ' + N(S.gw) + ' كلها · ' + cnt;
}
function initStats() {
  const all = S.gw != null ? startedFx(S.gw) : [], last = all[all.length - 1];
  if (!last) return;
  if (!S.st.fid || !all.some(f => String(f.id) === String(S.st.fid))) S.st.fid = last.id;

}
/* مستند الإحصائيات بيتحوّل لشكل واحد: { users: {uid: اختيار}, names: {uid: اسم} } سواء الجديد (بالـ uid) أو القديم (بالأسماء) */
function normStats(sd) {
  let users = sd.byUser || {}, names = sd.names;
  if (!names) {
    users = {}; names = {};
    Object.keys(sd.byUser || {}).forEach(n => { const uid = (sd.uidOf && sd.uidOf[n]) || ('n:' + n); users[uid] = sd.byUser[n]; names[uid] = n; });
  }
  Object.keys(names).forEach(u => { S.snames[u] = names[u]; });
  return { users, names, flags: sd.flags || null };
}
async function ensureStats(fxs) {

      await loadFixture(f.id, false);
      if (!S.stats[f.id]) { const r = await getDoc(doc(db, 'stats', String(f.id))); if (r.exists()) S.stats[f.id] = normStats(r.data()); }
    } catch (e) { console.error(e); }

}

const ppl = (fid, id) => { const d = S.fxdocs[fid]; return d ? d.players.find(x => x.i === id) : null; };
const tsn = (fid, p) => { const d = S.fxdocs[fid]; return d && p ? (p.t === d.h.id ? d.h : d.a).sn : ''; };
const ptsOf = (fid, pid) => { const sc = S.scores[fid]; return (sc && sc.pts && sc.pts[pid]) || 0; };

}

/* حساب نقط اختيار واحد في ماتش */
function calcPick(fid, p) {
  const d = S.fxdocs[fid], sc = S.scores[fid] || { pts: {}, status: 'ns' };
  const list = p.ids.map(id => d.players.find(x => x.i === id)).filter(Boolean).sort((a, b) => a.p - b.p);
  const base = list.reduce((s, pl) => s + (sc.pts[pl.i] || 0), 0);
  const cap = p.cap != null ? (sc.pts[p.cap] || 0) * (CAP_MULT - 1) : 0;
  let steal = 0;
  if (p.chip === 'steal' && p.team != null && sc.status === 'ft') steal = Math.max(0, ...d.players.filter(x => x.t === p.team).map(x => sc.pts[x.i] || 0));
  return { d, sc, list, base, cap, steal, total: base + cap + steal };
}

function aggStats() {
  const A = { n: 0, picks: {}, caps: {}, chips: [], pairs: {}, combos: [], users: new Set() };
  scopeFx().forEach(f => {
    const sd = S.stats[f.id]; if (!sd) return;
    Object.keys(sd.users).forEach(u => {
      if (S.gone.has(u)) return;
      const p = sd.users[u]; A.n++; A.users.add(u);
      p.ids.forEach(id => { const k = f.id + ':' + id; (A.picks[k] = A.picks[k] || { fid: f.id, id, users: [] }).users.push(u); });
      if (p.cap != null) { const k = f.id + ':' + p.cap; (A.caps[k] = A.caps[k] || { fid: f.id, id: p.cap, users: [] }).users.push(u); }
      if (p.chip) A.chips.push({ u, chip: p.chip, fid: f.id, team: p.team });
      const ids = [...p.ids].sort((a, b) => a - b);
      for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
        const k = f.id + ':' + ids[i] + '_' + ids[j];
        (A.pairs[k] = A.pairs[k] || { fid: f.id, a: ids[i], b: ids[j], users: [] }).users.push(u);
      }
      if (ids.length) { const k = f.id + ':' + ids.join('_'); let c = A.combos.find(x => x.k === k); if (!c) A.combos.push(c = { k, fid: f.id, ids, users: [] }); c.users.push(u); }
    });
  });
  return A;
}

/* ترتيب اللاعبين: بالملكية أو بالنقاط (الاتنين بيظهروا دايماً، والفرز بيغيّر الترتيب بس) */
function rowsFor(src) {
  const rows = Object.values(src).map(r => ({ ...r, n: r.users.length, pts: ptsOf(r.fid, r.id) }));
  const byPts = S.st.sort === 'pts';
  rows.sort((a, b) => (byPts ? (b.pts - a.pts) || (b.n - a.n) : (b.n - a.n) || (b.pts - a.pts)) || ((ppl(a.fid, a.id) || {}).n || '').localeCompare((ppl(b.fid, b.id) || {}).n || ''));
  return rows;
}
const sortBar = () => `<div class="r" style="gap:6px"><span class="m">الفرز:</span><button class="bt ${S.st.sort === 'own' ? 'on' : ''}" data-act="ssort" data-k="own" style="height:36px;padding:0 14px">بالملكية</button><button class="bt ${S.st.sort === 'pts' ? 'on' : ''}" data-act="ssort" data-k="pts" style="height:36px;padding:0 14px">بالنقاط</button></div>`;
function plCard(r, kind, mx) {
  const pl = ppl(r.fid, r.id); if (!pl) return '';
  const key = (kind === 'cap' ? 'c' : 'o') + r.fid + ':' + r.id, open = S.st.ex[key], own = S.st.sort !== 'pts';
  const hl = on => on ? 'color:#8bffb8;font-weight:800' : '';
  const pct = own ? (mx.n ? r.n / mx.n : 0) : (mx.p > 0 ? Math.max(0, r.pts) / mx.p : 0);
  let more = '';
  if (open) {
    if (kind === 'cap') more = `<div class="m mt">مين كبّنه</div>${nameList(r.users)}`;
    else {
      const partners = Object.values(S.agg.pairs).filter(x => x.fid === r.fid && (x.a === r.id || x.b === r.id)).sort((a, b) => b.users.length - a.users.length).slice(0, 8);
      more = `<div class="m mt">مين اختاره</div>${nameList(r.users)}${partners.length ? `<div class="m mt">اتاخد مع</div>${partners.map(x => { const o = ppl(r.fid, x.a === r.id ? x.b : x.a); return `<div class="r j" style="padding:6px 0;border-top:1px solid rgba(255,255,255,.18)"><span>${esc(o ? o.n : '؟')}</span><span class="pl">${N(x.users.length)}</span></div>`; }).join('')}` : ''}`;
    }
  }
  return `<div class="k" data-act="sx" data-k="${key}" style="cursor:pointer"><div class="r">${photo(pl)}<div class="g"><div class="nm">${esc(pl.n)} <span class="sub">${esc(tsn(r.fid, pl))}</span></div><div class="sub"><span style="${hl(own)}">${kind === 'cap' ? 'الكباتن' : 'الملكية'} ${N(r.n)}</span> · <span style="${hl(!own)}">النقاط ${N(r.pts)}</span></div></div><span class="m">${open ? 'إخفاء' : 'التفاصيل'}</span></div><div class="bar mt"><i style="width:${Math.round(pct * 100)}%"></i></div>${more}</div>`;
}
function listHtml(src, kind, emptyMsg) {

  const mx = { n: Math.max(...rows.map(r => r.n)), p: Math.max(...rows.map(r => r.pts)) };

function comboHtml(A) {

  <div class="k"><b>نفس التشكيلة بالظبط</b>${combos.length ? combos.map(x => row('k' + x.k, lab(x.fid, x.ids), x.users)).join('') : '<div class="m mt">مفيش تشكيلتين متطابقتين.</div>'}</div>`;
}
function searchHtml(A) {
  const q = S.st.q.trim().toLowerCase(); if (!q) return '';

  found.sort((a, b) => b.c - a.c);

  }).join('');
}

  const row = (key, label, uids, notes, live) => `<div data-act="sx" data-k="${key}" style="cursor:pointer;padding:8px 0;border-top:1px solid rgba(255,255,255,.18)"><div class="r j"><span class="g nm" style="font-size:13px">${label}${tmpPill(live)}</span><span class="pl bad">${N(uids.length)}</span></div>${S.st.ex[key] ? nameList(uids, notes) : ''}</div>`;

  let html = `<div class="m">مين نسي إيه ومين وقع في إيه في ${w} (بعد بداية الماتش). اضغط على أي سطر تشوف الأسماء.</div>`;

  fxs.forEach(f => {
    const sd = S.stats[f.id], d = S.fxdocs[f.id], sc = S.scores[f.id] || { pts: {}, st: {}, status: 'ns' };
    const ft = sc.status === 'ft', live = !ft, pts = id => (sc.pts && sc.pts[id]) || 0;
    const pl = id => d.players.find(x => x.i === id);
    const pn = id => { const o = pl(id); return o ? o.n : '؟'; };
    const per = {};
    roster.forEach(uid => {
      const p = sd.users[uid], ids = p ? p.ids : [];
      if (!ids.length) { per[uid] = { none: true, miss: [1, 2, 3, 4] }; return; }
      if (p.chip === 'free_pos') { per[uid] = { none: false, miss: Array(Math.max(0, 4 - ids.length)).fill(0) }; return; }
      const have = new Set(ids.map(id => (pl(id) || {}).p));
      per[uid] = { none: false, miss: [1, 2, 3, 4].filter(pos => !have.has(pos)) };
    });
    const played = roster.filter(u => !per[u].none);
    const label = pos => POS[pos] || 'لاعب (أي مركز)';
    const notesFor = uids => { const o = {}; uids.forEach(u => { o[u] = per[u].miss.map(p => POS[p] || 'لاعب').join('، '); }); return o; };
    const byPos = [1, 2, 3, 4, 0].map(pos => ({ pos, uids: played.filter(u => per[u].miss.includes(pos)) })).filter(x => x.uids.length);
    const grp = n => played.filter(u => per[u].miss.length === n);
    const none = roster.filter(u => per[u].none), g2 = grp(2), g3 = grp(3);
    const K = x => x + f.id;

    /* اللعيبة: مصاب/موقوف، دكة، سالب */
    const inj = {}, bench = {}, neg = {};
    played.forEach(u => {
      const ids = sd.users[u].ids;
      if (sd.flags) { const l = ids.filter(id => sd.flags[id]).map(id => pn(id) + ' (' + FLAG_N[sd.flags[id]] + ')'); if (l.length) inj[u] = l.join('، '); }
      if (ft && sc.st && Object.keys(sc.st).length) { const l = ids.filter(id => sc.st[id] !== 1 && pts(id) === 0).map(pn); if (l.length) bench[u] = l.join('، '); }
      const ng = ids.filter(id => pts(id) < 0).map(id => pn(id) + ' ' + N(pts(id))); if (ng.length) neg[u] = ng.join('، ');
    });

    /* الكابتن: فاشل، وغلط (فيه لاعب في تشكيلته جاب أكتر) */
    const badCap = {}, wrongCap = {};
    played.forEach(u => {
      const it = eff[u][f.id]; if (!it || it.invalid || it.p.cap == null) return;
      const cp = pts(it.p.cap);
      if (cp <= CARE.badCap) badCap[u] = pn(it.p.cap) + ' جاب ' + N(cp);
      const best = it.p.ids.reduce((b, id) => pts(id) > pts(b) ? id : b, it.p.cap);
      if (pts(best) > cp) wrongCap[u] = 'كبّن ' + pn(it.p.cap) + ' بدل ' + pn(best) + ' · خسر ' + N((pts(best) - cp) * (CAP_MULT - 1));
    });

    /* هلقط رزقي: بونص ضعيف، والفريق الغلط */
    const weak = {}, wrongTeam = {};
    if (ft) played.forEach(u => {
      const it = eff[u][f.id]; if (!it || it.invalid || it.p.chip !== 'steal' || it.p.team == null) return;
      const topOf = tid => Math.max(0, ...d.players.filter(x => x.t === tid).map(x => pts(x.i)));
      const mine = topOf(it.p.team), other = it.p.team === d.h.id ? d.a : d.h, theirs = topOf(other.id);
      if (mine <= CARE.weakSteal) weak[u] = 'البونص ' + N(mine);
      if (theirs > mine) wrongTeam[u] = 'كان ' + teamName(other) + ' هيجيب ' + N(theirs) + ' بدل ' + N(mine) + ' · خسر ' + N(theirs - mine);
    });

    /* قاع الماتش، والنجم اللي محدش شافه */
    const tot = {}; played.forEach(u => { const it = eff[u][f.id]; tot[u] = it ? it.c.total : 0; });
    const vals = [...new Set(Object.values(tot))].sort((a, b) => a - b);
    /* أقل واحد أو اتنين: لو الأقل لوحده بنضيف اللي بعده، ولو كله نفس النقط مفيش قاع */
    let bottom = [];
    if (vals.length > 1) { bottom = played.filter(u => tot[u] === vals[0]); if (bottom.length === 1 && vals.length > 2) bottom = played.filter(u => tot[u] <= vals[1]); }
    const bottomNotes = {}; bottom.forEach(u => { bottomNotes[u] = N(tot[u]) + ' نقطة'; });
    const top = Math.max(0, ...d.players.map(x => pts(x.i)));
    const stars = top > 0 ? d.players.filter(x => pts(x.i) === top) : [];
    const missedStar = stars.length ? played.filter(u => !stars.some(x => sd.users[u].ids.includes(x.i))) : [];
    const starName = stars.map(x => x.n).join(' و');

    const ks = o => Object.keys(o);
    const body = [
      group('التشكيلة', [
        ...byPos.map(x => row(K('cp' + x.pos + ':'), 'نسوا ' + label(x.pos), x.uids)),
        g2.length ? row(K('c2'), 'نسوا مركزين', g2, notesFor(g2)) : '',
        g3.length ? row(K('c3'), 'نسوا ٣ مراكز', g3, notesFor(g3)) : '',
        none.length ? row(K('c4'), 'ما اختاروش خالص', none) : ''

      group('اللعيبة', [
        ks(inj).length ? row(K('ci'), 'اختاروا لاعب مصاب أو موقوف', ks(inj), inj) : '',

        ks(wrongCap).length ? row(K('cw'), 'كبّن غلط', ks(wrongCap), wrongCap, live) : ''
      ]),
      group('هلقط رزقي', [
        ks(weak).length ? row(K('sw'), 'البونص كان ضعيف', ks(weak), weak) : '',
        ks(wrongTeam).length ? row(K('st'), 'لقط من الفريق الغلط', ks(wrongTeam), wrongTeam) : ''

      group('النتيجة', [
        bottom.length ? row(K('bt'), 'قاع الماتش', bottom, bottomNotes, live) : '',

      ])
    ].join('');
    html += `<div class="k"><div class="r j"><b>${esc(fxTitle(f))}</b><span class="m">${ft ? 'انتهى' : 'شغال'}</span></div>${body || '<div class="m mt">الكل تمام في الماتش ده ✓</div>'}${!ft ? '<div class="m mt">الدكة وهلقط رزقي بيظهروا بعد نهاية الماتش.</div>' : ''}</div>`;
  });
  if (!fxs.length) html += '<div class="k ctr">لسه مفيش إحصائيات جاهزة في النطاق ده.</div>';

  /* نسوا الكابتن: لكل يوم ماتشاته كلها بدأت */
  const capRows = [...new Set(fxs.map(f => dayKey(koOf(f))))].sort().map(dk => {
    const dayAll = gwFixtures(S.gw).filter(f => koOf(f) && dayKey(koOf(f)) === dk);
    const started = dayAll.every(f => allFx.some(x => String(x.id) === String(f.id)));

    const forgot = roster.filter(u => {

  });
  if (capRows.length) html += `<div class="k"><b>نسوا الكابتن</b>${capRows.join('')}</div>`;

  /* الخواص المنسية: بتظهر في آخر الجولة */

  if (!done) html += '<div class="k"><b>الخواص المنسية</b><div class="m mt">بتظهر في آخر الجولة، بعد ما كل الماتشات تخلص.</div></div>';

    const used = {};
    roster.forEach(u => { used[u] = new Set(Object.values(eff[u]).filter(it => it.p.chip && !it.invalid).map(it => it.p.chip)); });
    const z = roster.filter(u => used[u].size === 0), o1 = roster.filter(u => used[u].size === 1);
    html += `<div class="k"><b>الخواص المنسية في الجولة ${N(S.gw)}</b>${z.length ? row('cz', 'نسوا الخاصيتين', z) : ''}${o1.length ? row('co', 'نسوا خاصية واحدة', o1) : ''}${!z.length && !o1.length ? '<div class="m mt">الكل استخدم خاصيتين ✓</div>' : ''}</div>`;
  }
  return html;
}

function oppRows(others) {

}
function cmpSide(f, u) {

}

  const shared = new Set(a.list.map(x => x.i).filter(i => b.list.some(y => y.i === i)));

function cmpHtml(A) {

function ranked(rows) {
  let prev = null, rank = 0;
  return rows.map((r, i) => { if (!prev || r.pts !== prev.pts) rank = i + 1; prev = r; return { ...r, rank }; });
}
/* ───────── الترتيب ───────── */
const nameOfRow = r => S.names[r.uid] || r.name;
function rankRow(r, tap, sub, attrs) {

/* ترتيب ماتش واحد بنفس قواعد الحساب الرسمية (أول خاصيتين في الجولة، وكابتن واحد في اليوم) */
function matchRanking(fid) {
  const sd = S.stats[fid]; if (!sd || !S.fxdocs[fid]) return null;
  const ids = activeIds().length ? activeIds() : Object.keys(sd.users);
  const fxs = startedFx(S.gw);
  return ids.map(uid => {
    if (!sd.users[uid]) return { uid, name: nm(uid), none: true, total: 0, p: null, c: null };
    const it = effPicks(uid, fxs).find(x => String(x.f.id) === String(fid));
    if (!it) return { uid, name: nm(uid), none: true, total: 0, p: null, c: null };
    return { uid, name: nm(uid), none: false, total: it.c.total, p: it.p, c: it.c, it };

function boardMatchView(tabs) {

  if (bm.loading) return head + chips + '<div class="f"><div class="k ctr">جاري التحميل…</div></div>';
  const rows = matchRanking(fid);
  if (!rows) return head + chips + '<div class="f"><div class="k ctr">الترتيب بيتجهز دلوقتي، حدّث بعد دقيقة.</div></div>';
  const rk = ranked(rows.map(r => ({ ...r, pts: r.total })));
  const sc = S.scores[fid] || {};
  const notes = r => {

    if (r.p.chip) out.push(`<span class="pl ok">${CHIPS[r.p.chip].n}${r.p.chip === 'steal' && r.c.steal ? ' +' + N(r.c.steal) : ''}</span>`);

function vBoard() {
  const tabs = `<div class="tg"><button class="bt ${S.bt === 'total' ? 'on' : ''}" data-act="bt" data-k="total">الإجمالي</button>${S.gw != null ? `<button class="bt ${S.bt === 'gw' ? 'on' : ''}" data-act="bt" data-k="gw">الجولة ${N(S.gw)}</button><button class="bt ${S.bt === 'match' ? 'on' : ''}" data-act="bt" data-k="match">الماتش</button>` : ''}</div>`;

}

/* تشكيلة لاعب في الجولة أو في ماتش: بنطبّق نفس قواعد الحساب (أول خاصيتين، وكابتن واحد في اليوم) */
function effPicks(uid, fxs) {
  const list = fxs.filter(f => S.stats[f.id] && S.stats[f.id].users[uid] && S.fxdocs[f.id]).sort((a, b) => koOf(a) - koOf(b));
  const used = {}; let nUsed = 0; const capDay = {};
  return list.map(f => {
    const p = { ...S.stats[f.id].users[uid] };
    let chip = p.chip, dc = false, dcap = false;
    if (chip) {
      if (used[chip] || nUsed >= MAX_CHIPS || (chip === 'steal' && p.team !== f.h.id && p.team !== f.a.id)) { chip = null; dc = true; }
      else { used[chip] = true; nUsed++; }
    }
    let cap = p.cap;
    if (cap != null) { const dk = dayKey(koOf(f)); if (capDay[dk]) { cap = null; dcap = true; } else capDay[dk] = true; }
    const eff = { ...p, chip, cap, team: chip ? p.team : null };

/* صورة البروفايل: بتتصغّر وبتتخزن جوه مستند المستخدم، ومينفعش تتغيّر قبل ٣٠ يوم */
async function makeThumb(file) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const sz = Math.min(img.width, img.height), sx = (img.width - sz) / 2, sy = (img.height - sz) / 2;
  for (const [side, q] of [[192, 0.82], [160, 0.76], [128, 0.7], [96, 0.65]]) {
    const c = document.createElement('canvas'); c.width = c.height = side;
    c.getContext('2d').drawImage(img, sx, sy, sz, sz, 0, 0, side, side);
    const url = c.toDataURL('image/jpeg', q);
    if (url.length < 40000) return url;
  }
  throw new Error('الصورة كبيرة');
}

const PREF_DEF = { snd: true, fs: true };
const prefOn = k => { try { const v = localStorage.getItem('fd_' + k); return v == null ? PREF_DEF[k] : v === '1'; } catch (e) { return PREF_DEF[k]; } };

let actx = null;
function audio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume().catch(() => {});

  } catch (e) { return null; }
}
/* نغمة واحدة ناعمة: بتطلع وتختفي بسرعة من غير "طقّة" */
function tone(ctx, out, { f, f2, t = 0, d = .12, g = .1, type = 'sine' }) {

  v.gain.exponentialRampToValueAtTime(g, at + 0.006);
  v.gain.exponentialRampToValueAtTime(0.0001, at + d);
  o.connect(v); v.connect(out); o.start(at); o.stop(at + d + 0.02);
  return o;
}
/* أصوات من لينك (SOUND_LINKS فوق). بنحمّلها مرة واحدة ونشغّلها فوراً من الذاكرة.
   لو الموقع اللي عليه الملف مش سامح بالتحميل المباشر (CORS)، بنشغّله بطريقة تانية (Audio).
   ولو اللينك فاضي أو باظ، بيشتغل الصوت المتولّد بالكود. */
const sndBuf = {}, sndEl = {};
async function loadSound(k) {
  const L = SOUND_LINKS[k]; if (!L || !L.url || sndBuf[k] !== undefined) return;
  sndBuf[k] = null;
  const ctx = audio();
  try {
    if (!ctx) throw 0;
    const r = await fetch(L.url, { mode: 'cors', cache: 'force-cache' });
    if (!r.ok) throw 0;

  } catch (e) {
    const a = new Audio(); a.preload = 'auto'; a.src = L.url;
    a.addEventListener('canplaythrough', () => { sndEl[k] = a; }, { once: true });
    a.addEventListener('error', () => { console.warn('مقدرتش أحمّل صوت ' + k + ' من: ' + L.url); }, { once: true });
    a.load();

}
function playFile(k) {
  const L = SOUND_LINKS[k], ctx = audio(), b = sndBuf[k];
  if (ctx && b) {

    src.buffer = b; g.gain.value = L.vol;
    src.connect(g); g.connect(ctx.destination); src.start();
    return true;
  }
  if (sndEl[k]) {

    a.play().catch(() => {});

  }

}

  if (playFile('click')) return;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800; lp.connect(ctx.destination);
  tone(ctx, lp, { f: 760, f2: 430, d: .075, g: .05 });
  tone(ctx, lp, { f: 1520, f2: 900, d: .04, g: .012 });
}
/* صوت الدخول: خبطة كورة، صفارة حكم قصيرة، وأكورد بيعلى مع همهمة جمهور */
function introSound() {
  if (!prefOn('snd')) return;
  const ctx = audio(); if (!ctx) return;
  if (playFile('intro')) return;
  const m = ctx.createGain(); m.gain.value = .55;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
  m.connect(lp); lp.connect(ctx.destination);
  tone(ctx, m, { f: 150, f2: 45, d: .22, g: .5 });                       // الكورة
  [[.12, .09], [.26, .16]].forEach(([t, d]) => {                          // الصفارة
    const o = tone(ctx, m, { f: 2650, t, d, g: .07 });
    const l = ctx.createOscillator(), lg = ctx.createGain();
    l.frequency.value = 38; lg.gain.value = 70; l.connect(lg); lg.connect(o.frequency);
    l.start(ctx.currentTime + t); l.stop(ctx.currentTime + t + d + .02);
  });
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(ctx, m, { f, t: .5 + i * .085, d: .9 - i * .1, g: .12, type: 'triangle' }));   // الأكورد
  tone(ctx, m, { f: 261.63, t: .5, d: 1.1, g: .1, type: 'triangle' });
  const len = 1.4, buf = ctx.createBuffer(1, ctx.sampleRate * len, ctx.sampleRate), ch = buf.getChannelData(0);   // الجمهور
  for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  const n = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), ng = ctx.createGain(), at = ctx.currentTime + .45;
  n.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = .7;
  ng.gain.setValueAtTime(0.0001, at); ng.gain.exponentialRampToValueAtTime(.09, at + .5); ng.gain.exponentialRampToValueAtTime(0.0001, at + len - .05);
  n.connect(bp); bp.connect(ng); ng.connect(m); n.start(at); n.stop(at + len);
}
document.addEventListener('click', e => {
  if (e.target.closest('#intro')) return;
  const el = e.target.closest('button,[data-act],label.bt,a');
  if (el && !el.disabled) clickSound();
}, true);

/* ───────── ملء الشاشة ───────── */
const fsSupported = () => !!(document.fullscreenEnabled && document.documentElement.requestFullscreen);
let fsTried = false;
function goFullscreen(force) {
  if (!prefOn('fs') || isStandalone() || !fsSupported() || document.fullscreenElement) return;
  if (fsTried && !force) return;
  fsTried = true;
  document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
}
/* المتصفح بيسمح بملء الشاشة بعد ضغطة بس، فبنجربه مع أول ضغطة */
document.addEventListener('pointerup', () => goFullscreen(false), { once: true });

/* ───────── شاشة الدخول ───────── */
function showIntro() {
  const el = document.createElement('div');
  el.id = 'intro'; el.setAttribute('role', 'button'); el.setAttribute('aria-label', 'ادخل');
  el.innerHTML = `<div class="il"></div><svg class="ir" viewBox="0 0 250 250" aria-hidden="true"><circle cx="125" cy="125" r="120"/></svg>
    <div class="iw"></div><div class="ib">${BALL}</div><img class="ilg" src="icon-192.png" alt="">
    <div class="itx"><div class="itt">الفانتاسي اليومي</div><div class="its">اختار ٤ لاعبين من كل ماتش ونافس واثبتلهم انك التوب</div><div class="igo"><button class="bt on" type="button">يلا ندخل</button></div></div>`;
  document.body.appendChild(el);
  let done = false;
  const go = () => {
    if (done) return; done = true;
    goFullscreen(true);
    if (!played) introSound();
    el.classList.add('out');
    setTimeout(() => el.remove(), 550);
  };
  /* لو المتصفح سامح بالصوت من غير ضغطة، الشاشة بتكمّل لوحدها. غير كده بيظهر زرار "يلا ندخل" والصوت يشتغل معاه */
  const ctx = prefOn('snd') ? audio() : null;
  if (ctx) { loadSound('click'); loadSound('intro'); }
  const auto = !prefOn('snd') || (ctx && ctx.state === 'running');
  let played = false;
  if (auto && prefOn('snd')) setTimeout(() => { if (!done) { played = true; introSound(); } }, 1350);   // مع نزول الكورة
  setTimeout(() => { if (done) return; if (auto) go(); else el.classList.add('tap'); }, auto ? 2900 : 2300);
  setTimeout(() => el.addEventListener('click', go), 300);
}
showIntro();
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
