<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Mido’s Fantasy</title>
<script>(function(){try{var p=localStorage.getItem('fd_theme')||'auto',t=p==='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):p;document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='light'?'#eef4f0':'#0b1210'}catch(e){}})()</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* ===== الشكل الجديد: ليل زجاجي (داكن) + فاتح ===== */
:root{--fg:255,255,255;--afr:61,220,132;--bg:radial-gradient(circle at 85% 0,rgba(61,220,132,.28),transparent 45%),radial-gradient(circle at 0 70%,rgba(70,120,255,.18),transparent 50%),#0b1210;--tx:#f2f7f4;--mu:#a9bdb2;--ac:#7dffb0;--af:#3ddc84;--afx:#06150d;--gt:#ffd45c;--neg:#ff9a9a;--cd:rgba(255,255,255,.06);--cb:rgba(255,255,255,.14);--shbg:#111c17;--nvbg:rgba(20,32,27,.84);--pdbg:rgba(8,20,15,.5);--ov:rgba(3,10,7,.7);--sbbg:rgba(6,40,22,.5);--ptbg:rgba(14,80,45,.45);--lbg:linear-gradient(135deg,#052418,#0a4a35,#0b3560,#07182f);--sh1:0 8px 24px rgba(0,0,0,.2);color-scheme:dark}
:root[data-theme=light]{--fg:18,32,26;--afr:18,181,100;--bg:radial-gradient(circle at 85% 0,rgba(31,184,106,.22),transparent 45%),radial-gradient(circle at 0 70%,rgba(70,120,255,.14),transparent 50%),#eef4f0;--tx:#12201a;--mu:#51615a;--ac:#0a7d42;--af:#12b564;--afx:#04170c;--gt:#7a5200;--neg:#b3272c;--cd:rgba(255,255,255,.74);--cb:rgba(18,32,26,.12);--shbg:#fafdfb;--nvbg:rgba(255,255,255,.88);--pdbg:rgba(255,255,255,.6);--ov:rgba(18,32,26,.42);--sbbg:rgba(18,181,100,.12);--ptbg:rgba(18,181,100,.12);--lbg:linear-gradient(135deg,#dff5e8,#e3ecf9,#eef4f0,#d9efe3);--sh1:0 6px 18px rgba(18,32,26,.08);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:Rubik,Tahoma,sans-serif;color:var(--tx);font-size:14px;line-height:1.4;background:var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;left:50%;top:50%;width:230px;height:230px;margin:-115px;border:2px solid rgba(var(--fg),.14);border-radius:50%;pointer-events:none}
body::after{content:"";position:fixed;left:0;right:0;top:50%;height:2px;background:rgba(var(--fg),.14);pointer-events:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#app.nonav{padding-bottom:env(safe-area-inset-bottom)}
.h{padding:calc(18px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.h b,.d{font-weight:800}
.h b{font-size:26px}
.m{color:var(--mu);font-size:12px}
.f{flex:1;padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
.k{background:rgba(var(--fg),.11);border:1px solid rgba(var(--fg),.24);border-radius:14px;padding:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 24px rgba(0,0,0,.16);color:var(--tx);text-align:start;width:100%}
/* التوقعات */
.pkr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px}
.pkr .t{width:auto;justify-self:center;gap:8px}
.pft{margin:16px -14px -16px;overflow:hidden}
.pk.ex{border:2px solid var(--af)}
.sb{width:60px;height:60px;border-radius:14px;border:2px solid var(--af);background:var(--sbbg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;color:var(--tx)}
.sc{display:inline-flex;gap:5px;font-weight:700;direction:rtl}
.sc i{font-style:normal;opacity:.7}
.pc{display:inline-flex;padding:3px 11px;border-radius:999px;border:1.5px solid var(--af);font-size:13px}
.ib{width:40px;height:40px;border:0;background:none;color:var(--mu);display:flex;align-items:center;justify-content:center;padding:0}
.pf{display:flex;align-items:center;justify-content:space-between;width:100%;margin:0;height:46px;font-size:15px;padding:0 12px;border:0;border-top:1px solid rgba(var(--fg),.16);background:rgba(0,0,0,.16);color:var(--tx);font-weight:700}
.pf.bo{background:#f5b301;color:#1a1300}
.pf.bo .m,.pf.bo .pl{color:#1a1300}
.pd{margin:0;padding:12px 14px;background:var(--pdbg);border-top:1px solid rgba(var(--fg),.12);display:flex;flex-direction:column}
.ov{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:var(--ov)}
.sh{width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;box-sizing:border-box;background:var(--shbg);border-radius:22px 22px 0 0;border-top:1px solid rgba(var(--fg),.2);padding:10px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;color:var(--tx);cursor:auto}
.sh .hd{align-self:center;width:40px;height:4px;border-radius:2px;background:rgba(var(--fg),.7);flex:none}
.wh{display:flex;flex-direction:column;align-items:center;touch-action:none;user-select:none}
.wh .nb{width:60px;height:44px;border:0;background:none;color:rgba(var(--fg),.4);font-weight:800;font-size:26px}
.wh .nv2{width:62px;height:62px;border-radius:14px;border:2px solid var(--af);background:var(--sbbg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:32px}
.chp{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--tx);padding:0}
.chp>span:first-child{display:inline-flex;padding:5px 14px;border-radius:999px;border:1.5px solid var(--af)}
.chp.on>span:first-child{background:var(--af);color:var(--afx)}
.fm{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.fm.W{background:#2fbf5b;color:var(--afx)}.fm.D{background:#9fb0c0;color:#0d3554}.fm.L{background:#d63a3f;color:var(--tx)}
.r{display:flex;align-items:center;gap:10px}
.j{justify-content:space-between}
.g{flex:1;min-width:0}
.cr{display:flex;justify-content:center;padding-top:7px;width:34px;height:38px;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);background:var(--c,#334);font-weight:800;font-size:11px;color:var(--tx)}
.crw{position:relative;display:inline-block;width:38px;height:42px;flex:none}
.crw .cr{width:100%;height:100%}
.crw img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.t{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px;font-weight:700;text-align:center}
.bt{height:44px;border:1px solid rgba(var(--fg),.22);border-radius:10px;font-weight:700;background:rgba(var(--fg),.13);color:var(--tx);padding:0 16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bt.on{background:var(--af);color:var(--afx);border-color:var(--af)}
.bt.red{background:#d63a3f;border-color:#d63a3f}
.bt:disabled{opacity:.5;cursor:not-allowed}
.tg{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.tg::-webkit-scrollbar{display:none}
.tg .bt{flex:1 0 auto;padding:0 14px;white-space:nowrap}
/* أزرار الجولات والأيام: كلها بنفس العرض (تلت السطر)، ولو أكتر من ٣ السطر بيتسحب */
.tg.eq .bt{flex:0 0 calc((100% - 12px) / 3);min-width:0;padding:0 6px;overflow:hidden;text-overflow:ellipsis}
.tg.eq .bt.dy{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.tg.eq .bt.dy small{font-weight:500;font-size:11px;opacity:.85}
.pl{font-weight:700;font-size:11px;padding:3px 9px;border-radius:6px;background:rgba(var(--fg),.16);color:var(--mu);white-space:nowrap}
.pl.lv{background:#d63a3f;color:var(--tx)}
.pl.ok{background:rgba(var(--afr),.26);color:var(--ac)}
.pl.bad{background:#d63a3f;color:var(--tx)}
.nv{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:var(--nvbg);border-top:1px solid rgba(var(--fg),.2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:5}
.n{flex:1;border:0;background:none;color:var(--mu);font-weight:500;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.n svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.n.on{color:var(--ac)}
.c{width:22px;height:22px;border-radius:50%;background:#f5b301;color:#1a1300;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.cb{width:44px;height:44px;border-radius:12px;border:1px solid rgba(245,179,1,.7);background:rgba(245,179,1,.15);color:var(--gt);font-weight:800;font-size:16px}
.cb.on{background:#f5b301;color:#1a1300}
.in{height:48px;width:100%;border-radius:10px;border:1px solid rgba(var(--fg),.28);background:rgba(var(--fg),.13);color:var(--tx);padding:0 14px}
.in::placeholder{color:var(--mu)}
.dz{opacity:.4}
.pt{margin:0 16px 12px;background:var(--ptbg);border:1px solid rgba(var(--fg),.26);border-radius:14px;padding:10px;display:flex;gap:8px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.sl{flex:1;min-width:0;height:96px;border-radius:10px;border:1px dashed rgba(var(--fg),.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mu);position:relative;padding:4px;background:none;text-align:center}
.sl.fl{border:1px solid var(--af);background:var(--sbbg);color:var(--tx)}
.sl.act{box-shadow:0 0 0 2px rgba(var(--fg),.7)}
.sl .c{position:absolute;top:-8px;left:-6px}
.sl .cs{width:26px;height:26px;top:-10px;left:-8px;padding:0;border:1px dashed rgba(var(--fg),.6);background:var(--shbg);color:rgba(var(--fg),.75);cursor:pointer;z-index:2}
.sl .cs.on{background:#f5b301;color:#1a1300;border:1px solid #f5b301}
.sl .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.av{width:36px;height:36px;border-radius:50%;background:rgba(var(--fg),.18);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--tx);flex:none;overflow:hidden}
.bar{height:6px;border-radius:3px;background:rgba(var(--fg),.2)}
.bar i{display:block;height:100%;border-radius:3px;background:var(--af)}
.ph{position:relative;display:inline-block;width:38px;height:44px;flex:none}
.ph svg{width:100%;height:100%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.pr{padding:10px 12px;cursor:pointer;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;content-visibility:auto;contain-intrinsic-size:auto 66px}
.phd{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:6px 0 -6px}
.phd .m{font-size:11px}
.rw{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.rw::-webkit-scrollbar{display:none}
.pgd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pcd{position:relative;display:flex;flex-direction:column;min-width:0;padding:4px 4px 6px;border-radius:14px;background:rgba(var(--fg),.11);border:1px solid rgba(var(--fg),.24);color:var(--tx);text-align:center;cursor:pointer;scroll-snap-align:start}
.rw .pcd{flex:none;width:calc((100% - 18px) / 4.35)}
.pph{position:relative;display:block;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:linear-gradient(160deg,#2a6aa3 0%,#123a5e 100%)}
.pph .ph{display:block;width:100%;height:100%}
.pnm{position:relative;z-index:1;display:block;margin-top:-12px;height:24px;line-height:23px;border-radius:10px;background:var(--shbg);border:1px solid rgba(var(--fg),.24);font-size:11px;font-weight:700;padding:0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ppt{display:block;margin-top:4px;height:22px;line-height:22px;border-radius:10px;background:rgba(var(--fg),.13);font-size:11px;font-weight:700}
.pcd.sel{border:2px solid var(--af);background:rgba(var(--afr),.16);padding:3px 3px 5px}
.pcd.sel .pnm{background:var(--af);border-color:var(--af);color:var(--afx)}
.pcd.sel .ppt{background:var(--af);color:var(--afx)}
.pck{position:absolute;top:4px;left:4px;z-index:2;width:18px;height:18px;border-radius:50%;background:var(--af);color:var(--afx);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.pst{position:absolute;top:5px;right:5px;z-index:2;width:9px;height:9px;border-radius:50%;background:var(--gt);border:1.5px solid var(--shbg)}
.pkh{position:sticky;top:0;z-index:2;background:var(--shbg);display:flex;flex-direction:column;gap:10px;padding:6px 0 10px}
.pkp{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.pkp::-webkit-scrollbar{display:none}
.pi{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid rgba(var(--fg),.28);background:none;color:var(--tx);font-size:13px}
.pi.on{background:var(--af);border-color:var(--af);color:var(--afx);font-weight:700}
.pk{padding:16px 14px;overflow:hidden}
.pr.sel{border-color:var(--af);background:rgba(var(--afr),.16)}
.nm{font-weight:700}
.sub{color:var(--mu);font-size:11px}
.warn{color:var(--gt)}
.ctr{text-align:center}
.mt{margin-top:8px}
.mc{display:block;padding:14px;cursor:pointer}
.evs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.evs>div{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.evp{font-size:13px;padding:3px 9px;border-radius:999px;background:rgba(var(--fg),.14)}.evp.me{background:rgba(245,179,1,.42);font-weight:800}
button.evp{color:var(--tx);border:0;font:inherit;font-size:13px;line-height:1.5}
.evt+.evt{margin-top:10px;padding-top:10px;border-top:1px solid rgba(var(--fg),.16)}
.tm{font-weight:800;font-size:22px;line-height:1.2}
.lsc{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:24px;line-height:1.2}.lsc i{font-style:normal;opacity:.55}.lsc.sm{font-size:15px;gap:5px}
.ldot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-inline-end:5px;vertical-align:middle;animation:ldp 1.2s infinite}
@keyframes ldp{50%{opacity:.2}}@media (prefers-reduced-motion:reduce){.ldot{animation:none}}
.sv{font-size:11px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--shbg);border:1px solid rgba(var(--fg),.3);color:var(--tx);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.login{justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 24px 24px;gap:12px;flex:1;display:flex;flex-direction:column}
.logo{width:64px;height:64px;border-radius:16px;background:var(--af);color:var(--afx);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:34px}
img.logo{background:none;object-fit:cover;width:72px;height:72px;border-radius:18px}
.gbtn{height:50px;background:#fff;color:#1f1f1f;border:0}
.err{color:var(--neg);font-size:13px}
a.lnk,.lnk{color:var(--ac);background:none;border:0;padding:6px 0;text-decoration:underline}
/* خلفية الدخول المتحركة */
.lbg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--lbg);background-size:300% 300%;animation:lg 20s ease infinite}
@keyframes lg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.lbg>i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:orb 16s ease-in-out infinite alternate}
.lbg>i:nth-child(1){width:55vmax;height:55vmax;left:-18vmax;top:-14vmax;background:#18c070}
.lbg>i:nth-child(2){width:50vmax;height:50vmax;right:-16vmax;bottom:-14vmax;background:#2f7bff;animation-duration:22s}
.lbg>i:nth-child(3){width:26vmax;height:26vmax;left:35%;top:40%;background:#f5b301;opacity:.18;animation-duration:26s}
@keyframes orb{from{transform:translate(0,0) scale(1)}to{transform:translate(9vmax,7vmax) scale(1.25)}}
.lbg .pc{position:absolute;left:50%;top:50%;width:min(80vmin,420px);height:min(80vmin,420px);margin:calc(min(80vmin,420px)/-2);border:2px solid rgba(var(--fg),.16);border-radius:50%;animation:pulse 6s ease-in-out infinite}
.lbg .pcl{position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(var(--fg),.12)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.06);opacity:1}}
.lbg>b{position:absolute;bottom:-70px;width:var(--s,28px);height:var(--s,28px);opacity:0;animation:rise var(--d,14s) linear infinite;animation-delay:var(--l,0s)}
.lbg>b svg{width:100%;height:100%}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.55}90%{opacity:.45}100%{transform:translateY(-118vh) rotate(420deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.lbg,.lbg *{animation:none!important}}
/* أزرار الدخول باللوجو */
.sbtn{display:flex;align-items:center;justify-content:center;gap:12px;height:52px;border-radius:14px;font-size:15px}
.sbtn .si{width:26px;height:26px;flex:none;display:flex}
.sbtn svg{width:100%;height:100%}
.fbtn{background:#1877f2;color:var(--tx);border:0}
.legal{display:flex;justify-content:center;gap:16px;font-size:12px;margin-top:4px}
.legal a{color:var(--mu)}
/* علامة X لشيل اللاعب من المربع */
.rm{position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;background:#d63a3f;color:var(--tx);border:0;padding:0;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2}
.rm::after{content:"";position:absolute;inset:-12px}
div.sl{cursor:pointer}
/* شاشة الدخول: دايرة نص الملعب بترسم نفسها، الكورة بتنزل على نقطة السنتر وبتتحول للوجو */
#intro{position:fixed;inset:0;z-index:40;overflow:hidden;background:var(--bg);transition:opacity .5s ease,transform .5s ease;cursor:pointer}
#intro.out{opacity:0;transform:scale(1.06);pointer-events:none}
#intro .il{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:rgba(var(--fg),.32);transform:scaleX(0);animation:ilx .7s cubic-bezier(.6,0,.2,1) .05s forwards}
#intro .ir{position:absolute;left:50%;top:50%;width:250px;height:250px;margin:-125px}
#intro .ir circle{fill:none;stroke:rgba(var(--fg),.45);stroke-width:2;stroke-dasharray:754;stroke-dashoffset:754;animation:ird 1s cubic-bezier(.5,0,.2,1) .25s forwards}
#intro .ib{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px;transform:translateY(-62vh);animation:ibd .75s cubic-bezier(.45,0,.9,.5) .7s forwards,ibo .25s ease 1.45s forwards}
#intro .ib svg{width:100%;height:100%;animation:ibs .75s linear .7s}
#intro .iw{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px;border-radius:50%;border:3px solid var(--af);opacity:0;animation:iwv .9s ease-out 1.42s}

function canPick(fx, p, pl) {
  const five = p5On(S.fx);   // لاعب خامس (المحل): ٥ لاعبين، مركز واحد يتكرر، و٣ من فريق
  if (p.ids.length >= (five ? 5 : 4)) return five ? 'اخترت ٥ لاعبين بالفعل' : 'اخترت ٤ لاعبين بالفعل';
  const of = id => fx.players.find(x => x.i === id);
  if (p.chip !== 'free_pos' && p.ids.some(id => { const o = of(id); return o && o.p === pl.p; })) {
    const pos = {}; p.ids.forEach(id => { const o = of(id); if (o) pos[o.p] = (pos[o.p] || 0) + 1; });
    if (!five || Object.values(pos).some(n => n > 1)) return five ? 'كررت مركز قبل كده، مركز واحد بس ممكن يتكرر' : 'مركز ' + POS[pl.p] + ' مختار بالفعل، شيله الأول';
  }
  const same = p.ids.filter(id => { const o = of(id); return o && o.t === pl.t; }).length;
  if (p.chip !== 'free_team' && same >= (five ? 3 : 2)) return five ? 'مينفعش أكتر من ٣ من نفس الفريق' : 'مينفعش أكتر من لاعبين من نفس الفريق';
  return null;
}
/* الاختيار سليم بقواعد الخاصية دي؟ (chip = null يعني القواعد العادية) */
function validIds(fx, ids, chip, five) {
  if (new Set(ids).size !== ids.length) return false;   // نفس اللاعب مرتين ممنوع
  const pos = {}, team = {};
  let dup = 0;
  for (const id of ids) {
    const o = fx.players.find(x => x.i === id);
    if (!o) return false;
    pos[o.p] = (pos[o.p] || 0) + 1; team[o.t] = (team[o.t] || 0) + 1;
    if (chip !== 'free_pos' && pos[o.p] > 1) dup++;
    if (chip !== 'free_team' && team[o.t] > (five ? 3 : 2)) return false;
  }
  return dup <= (five ? 1 : 0) && ids.length <= (five ? 5 : 4);
}

}

/* ───────── تحديث مكاني للصفحة (بدل innerHTML): بيغيّر بس اللي اتغيّر، فمفيش وميض ولا إعادة تحميل صور ───────── */
function morphKids(a, b) {
  const ac = [...a.childNodes], bc = [...b.childNodes];
  for (let i = 0; i < bc.length; i++) {
    const y = bc[i], x = ac[i];
    if (!x) { a.appendChild(y); continue; }
    if (x.nodeType !== y.nodeType || (x.nodeType === 1 && x.nodeName !== y.nodeName)) { a.replaceChild(y, x); continue; }
    if (x.nodeType !== 1) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; continue; }
    /* شعارات وصور اللاعبين: لو نفس الصورة سيبها زي ما هي (الـ onload بيعدّل ستايل جنبها) */
    if ((x.classList.contains('crw') || x.classList.contains('ph')) && x.querySelector('img') && y.querySelector('img') && x.querySelector('img').dataset.c === y.querySelector('img').dataset.c && x.querySelector('img').dataset.k === y.querySelector('img').dataset.k) continue;
    for (const at of [...x.attributes]) if (!y.hasAttribute(at.name)) x.removeAttribute(at.name);
    for (const at of [...y.attributes]) if (x.getAttribute(at.name) !== at.value) x.setAttribute(at.name, at.value);
    const tn = x.nodeName;
    if (tn === 'INPUT' || tn === 'TEXTAREA' || tn === 'SELECT') {
      if (document.activeElement !== x) { if (tn !== 'INPUT' || (x.type !== 'checkbox' && x.type !== 'radio')) x.value = y.getAttribute('value') ?? (tn === 'TEXTAREA' ? y.value : ''); else x.checked = y.hasAttribute('checked'); }
      if (tn !== 'TEXTAREA') continue;
    }
    morphKids(x, y);
  }
  for (let j = ac.length - 1; j >= bc.length; j--) a.removeChild(ac[j]);
}
function setHtml(el, html) { const t = document.createElement('template'); t.innerHTML = html; morphKids(el, t.content); }

}

  /* بطولة فرق: الفريق بيتعامل في القرعة زي لاعب واحد (T1، T2...). التكوين: قرعة عشوائية أو توزيعك اليدوي. */
  let teams = null, parts = c.uids;

    teams = {}; grp.forEach((m, i) => { teams['T' + (i + 1)] = { name: ((tn.tform === 'manual' && tn.tnames[i]) || '').trim() || 'فريق ' + (i + 1), uids: m }; });

  }
  const dr = makeDraw(c.sizes, tn.legs, c.R, parts, cryptoRand);

  const id = Date.now().toString(36);
  await setDoc(doc(db, 'tournaments', id), data);

}

const startedFx = g => gwFixtures(g).filter(f => koOf(f) && Date.now() >= koOf(f) + 120000).sort((a, b) => koOf(a) - koOf(b));
const fxTitle = f => teamName(f.h) + ' ضد ' + teamName(f.a);
function scopeFx() {
  const st = S.st, all = S.gw != null ? startedFx(S.gw) : [];
  if (st.kind === 'match') return all.filter(f => String(f.id) === String(st.fid));
  if (st.kind === 'day') return all.filter(f => dayKey(koOf(f)) === st.day);
  return all;
}
const scopeWord = () => ({ match: 'الماتش', day: 'اليوم', gw: 'الجولة' })[S.st.kind];
function scopeLabel() {
  const st = S.st, fx = scopeFx(), n = fx.length, cnt = n === 1 ? 'ماتش واحد' : N(n) + ' ماتشات';
  if (st.kind === 'match') return fx[0] ? 'ماتش ' + fxTitle(fx[0]) : 'ماتش معين';
  if (st.kind === 'day') return 'يوم ' + fmtDay(Date.parse(st.day + 'T12:00:00Z')) + ' · ' + cnt;
  return 'الجولة ' + N(S.gw) + ' كلها · ' + cnt;
}
function initStats() {
  const all = S.gw != null ? startedFx(S.gw) : [], last = all[all.length - 1];
  if (!last) return;
  if (!S.st.fid || !all.some(f => String(f.id) === String(S.st.fid))) S.st.fid = last.id;
  if (!S.st.day || !all.some(f => dayKey(koOf(f)) === S.st.day)) S.st.day = dayKey(koOf(last));
}
/* مستند الإحصائيات بيتحوّل لشكل واحد: { users: {uid: اختيار}, names: {uid: اسم} } سواء الجديد (بالـ uid) أو القديم (بالأسماء) */
function normStats(sd) {
  let users = sd.byUser || {}, names = sd.names;
  if (!names) {
    users = {}; names = {};
    Object.keys(sd.byUser || {}).forEach(n => { const uid = (sd.uidOf && sd.uidOf[n]) || ('n:' + n); users[uid] = sd.byUser[n]; names[uid] = n; });
  }
  Object.keys(names).forEach(u => { S.snames[u] = names[u]; });
  return { users, names, flags: sd.flags || null };
}
async function ensureStats(fxs) {
  await Promise.all(fxs.map(async f => {
    try {
      await loadFixture(f.id, false);
      if (!S.stats[f.id]) { const r = await getDoc(doc(db, 'stats', String(f.id))); if (r.exists()) S.stats[f.id] = normStats(r.data()); }
    } catch (e) { console.error(e); }
  }));
}
async function loadStatsScope() {
  await Promise.all([loadNames(), ensureStats(scopeFx())]);
  if (S.st.tab === 'care' && S.gw != null) await ensureStats(startedFx(S.gw));
}
async function refreshStats() { initStats(); S.st.loading = true; render(); await loadStatsScope(); S.st.loading = false; render(); }
const ppl = (fid, id) => { const d = S.fxdocs[fid]; return d ? d.players.find(x => x.i === id) : null; };
const tsn = (fid, p) => { const d = S.fxdocs[fid]; return d && p ? (p.t === d.h.id ? d.h : d.a).sn : ''; };
const ptsOf = (fid, pid) => { const sc = S.scores[fid]; return (sc && sc.pts && sc.pts[pid]) || 0; };

/* قايمة أسماء (أبجدياً)، وتقدر تحط ملاحظة جنب كل اسم */
function nameList(uids, notes, keepOrder) {
  const me = S.user.uid;
  return `<div style="display:flex;flex-direction:column;margin-top:8px">${(keepOrder ? [...uids] : [...uids].sort((a, b) => byName(nm(a), nm(b)))).map(u => `<div class="r" style="padding:8px 0;border-top:1px solid rgba(var(--fg),.18)">${avatar(photoOf(u), nm(u), 28)}<span class="g">${esc(nm(u))}${u === me ? ' (أنت)' : ''}</span>${notes && notes[u] ? `<span class="sub">${esc(notes[u])}</span>` : ''}</div>`).join('')}</div>`;
}

/* حساب نقط اختيار واحد في ماتش */
function calcPick(fid, p) {
  const d = S.fxdocs[fid], sc = S.scores[fid] || { pts: {}, status: 'ns' };
  const list = p.ids.map(id => d.players.find(x => x.i === id)).filter(Boolean).sort((a, b) => a.p - b.p);
  const base = list.reduce((s, pl) => s + (sc.pts[pl.i] || 0), 0);
  const cap = p.cap != null ? (sc.pts[p.cap] || 0) * (CAP_MULT - 1) : 0;
  let steal = 0;
  if (p.chip === 'steal' && p.team != null && sc.status === 'ft') steal = Math.max(0, ...d.players.filter(x => x.t === p.team).map(x => sc.pts[x.i] || 0));
  const xb = p.xb || 0;   // نقط المحل الزيادة (من Code.gs)
  return { d, sc, list, base, cap, steal, xb, total: base + cap + steal + xb };
}

function aggStats() {
  const A = { n: 0, picks: {}, caps: {}, chips: [], pairs: {}, combos: [], users: new Set() };
  scopeFx().forEach(f => {
    const sd = S.stats[f.id]; if (!sd) return;
    Object.keys(sd.users).forEach(u => {
      if (S.gone.has(u)) return;
      const p = sd.users[u]; A.n++; A.users.add(u);
      p.ids.forEach(id => { const k = f.id + ':' + id; (A.picks[k] = A.picks[k] || { fid: f.id, id, users: [] }).users.push(u); });
      if (p.cap != null) { const k = f.id + ':' + p.cap; (A.caps[k] = A.caps[k] || { fid: f.id, id: p.cap, users: [] }).users.push(u); }
      if (p.chip) A.chips.push({ u, chip: p.chip, fid: f.id, team: p.team });
      const ids = [...p.ids].sort((a, b) => a - b);
      for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
        const k = f.id + ':' + ids[i] + '_' + ids[j];
        (A.pairs[k] = A.pairs[k] || { fid: f.id, a: ids[i], b: ids[j], users: [] }).users.push(u);
      }
      if (ids.length) { const k = f.id + ':' + ids.join('_'); let c = A.combos.find(x => x.k === k); if (!c) A.combos.push(c = { k, fid: f.id, ids, users: [] }); c.users.push(u); }
    });
  });
  return A;
}
const othersList = () => [...aggStats().users].filter(u => u !== S.user.uid).sort((a, b) => byName(nm(a), nm(b)));

function vStats() {

    : st.kind === 'day' ? `<div class="tg">${days.map(k => `<button class="bt ${st.day === k ? 'on' : ''}" data-act="sday" data-k="${k}" style="font-size:13px">${esc(fmtDay(Date.parse(k + 'T12:00:00Z')))}</button>`).join('')}</div>` : '';

  <div class="m" style="padding:0 16px 8px">النطاق: ${esc(scopeLabel())}</div>

function renderStatsBody() {

/* ترتيب اللاعبين: بالملكية أو بالنقاط (الاتنين بيظهروا دايماً، والفرز بيغيّر الترتيب بس) */
function rowsFor(src) {
  const rows = Object.values(src).map(r => ({ ...r, n: r.users.length, pts: ptsOf(r.fid, r.id) }));
  const byPts = S.st.sort === 'pts';
  rows.sort((a, b) => (byPts ? (b.pts - a.pts) || (b.n - a.n) : (b.n - a.n) || (b.pts - a.pts)) || ((ppl(a.fid, a.id) || {}).n || '').localeCompare((ppl(b.fid, b.id) || {}).n || ''));
  return rows;
}
const sortBar = () => `<div class="r" style="gap:6px"><span class="m">الفرز:</span><button class="bt ${S.st.sort === 'own' ? 'on' : ''}" data-act="ssort" data-k="own" style="height:36px;padding:0 14px">بالملكية</button><button class="bt ${S.st.sort === 'pts' ? 'on' : ''}" data-act="ssort" data-k="pts" style="height:36px;padding:0 14px">بالنقاط</button></div>`;
function plCard(r, kind, mx) {
  const pl = ppl(r.fid, r.id); if (!pl) return '';
  const key = (kind === 'cap' ? 'c' : 'o') + r.fid + ':' + r.id, open = S.st.ex[key], own = S.st.sort !== 'pts';
  const hl = on => on ? 'color:var(--ac);font-weight:800' : '';
  const pct = own ? (mx.n ? r.n / mx.n : 0) : (mx.p > 0 ? Math.max(0, r.pts) / mx.p : 0);
  let more = '';
  if (open) {
    if (kind === 'cap') more = `<div class="m mt">مين اختاره كابتن</div>${nameList(r.users)}`;
    else {
      const partners = Object.values(S.agg.pairs).filter(x => x.fid === r.fid && (x.a === r.id || x.b === r.id)).sort((a, b) => b.users.length - a.users.length).slice(0, 8);
      more = `<div class="m mt">مين اختاره</div>${nameList(r.users)}${partners.length ? `<div class="m mt">اتاخد مع</div>${partners.map(x => { const o = ppl(r.fid, x.a === r.id ? x.b : x.a); return `<div class="r j" style="padding:6px 0;border-top:1px solid rgba(var(--fg),.18)"><span>${esc(o ? o.n : '؟')}</span><span class="pl">${N(x.users.length)}</span></div>`; }).join('')}` : ''}`;
    }
  }
  return `<div class="k" data-act="sx" data-k="${key}" style="cursor:pointer"><div class="r">${photo(pl)}<div class="g"><div class="nm">${esc(pl.n)} <span class="sub">${esc(tsn(r.fid, pl))}</span></div><div class="sub"><span style="${hl(own)}">${kind === 'cap' ? 'الكباتن' : 'الملكية'} ${N(r.n)}</span> · <span style="${hl(!own)}">النقاط ${N(r.pts)}</span></div></div><span class="m">${open ? 'إخفاء' : 'التفاصيل'}</span></div><div class="bar mt"><i style="width:${Math.round(pct * 100)}%"></i></div>${more}</div>`;
}
function listHtml(src, kind, emptyMsg) {
  const rows = rowsFor(src);
  if (!rows.length) return `<div class="k ctr">${emptyMsg}</div>`;
  const mx = { n: Math.max(...rows.map(r => r.n)), p: Math.max(...rows.map(r => r.pts)) };
  return sortBar() + rows.map(r => plCard(r, kind, mx)).join('');
}
const playersHtml = A => listHtml(A.picks, 'own', 'محدش اختار لاعبين.');
const capsHtml = A => listHtml(A.caps, 'cap', 'محدش اختار كابتن.');

function chipsHtml(A) {

      const d = S.fxdocs[x.fid]; if (!d) return '';
      const t = c === 'steal' && x.team != null ? (x.team === d.h.id ? d.h : d.a) : null;
      return `<div class="r j" style="padding:8px 0;border-top:1px solid rgba(var(--fg),.18)"><span class="r" style="gap:8px">${avatar(photoOf(x.u), nm(x.u), 28)}${esc(nm(x.u))}${x.u === me ? ' (أنت)' : ''}</span><span class="sub">${esc(d.h.sn)} ضد ${esc(d.a.sn)}${t ? ' · فريق ' + esc(t.sn) : ''}</span></div>`;
    }).join('') : '<div class="m mt">محدش استخدمها.</div>'}</div>`;
  }).join('');
}
/* كومبو يدوي: تختار لعيبة (من أي ماتش في النطاق) وتشوف كام واحد اختارهم كلهم مع بعض */
const MC_MAX = 6;
function manualCombo(A) {
  const multi = scopeFx().length > 1;
  const name = k => { const r = A.picks[k], p = r && ppl(r.fid, r.id); return p ? esc(p.n) + (multi ? ' <span class="sub">' + esc(tsn(r.fid, p)) + '</span>' : '') : '؟'; };
  const sel = (S.st.mc || []).filter(k => A.picks[k]);
  let res = '';
  if (sel.length) {
    const users = [...A.picks[sel[0]].users].filter(u => sel.every(k => A.picks[k].users.includes(u)));
    const key = 'mc:' + sel.join(',');
    res = `<div data-act="sx" data-k="${key}" style="cursor:pointer;padding:10px 0;border-top:1px solid rgba(var(--fg),.18)"><div class="r j"><span class="g">${sel.length > 1 ? 'اختاروهم كلهم مع بعض' : 'اختاروه'}</span><span class="pl ${users.length ? 'ok' : ''}">${N(users.length)} من ${N(A.users.size)}</span></div>${S.st.ex[key] && users.length ? nameList(users) : users.length ? '<div class="m">دوس علشان تشوف الأسماء</div>' : ''}</div>`;
  }
  const q = S.st.q.trim().toLowerCase();
  const opts = Object.keys(A.picks).filter(k => !sel.includes(k)).map(k => ({ k, r: A.picks[k], p: ppl(A.picks[k].fid, A.picks[k].id) }))
    .filter(x => x.p && (!q || x.p.n.toLowerCase().includes(q))).sort((a, b) => b.r.users.length - a.r.users.length).slice(0, 30);
  return `<div class="k"><div class="r j"><b>كومبو يدوي</b>${sel.length ? '<button class="lnk" data-act="mcclr">مسح</button>' : ''}</div>
    <div class="m">اختار لعيبة (لحد ${N(MC_MAX)}) وشوف كام واحد اختارهم كلهم في ${scopeWord()}.${q ? '' : ' تقدر تدوّر بالاسم من خانة البحث فوق.'}</div>
    ${sel.length ? `<div class="evs" style="grid-template-columns:1fr;margin-top:8px"><div>${sel.map(k => `<button class="evp me" data-act="mcx" data-k="${k}">${name(k)} ×</button>`).join('')}</div></div>` : ''}
    ${res}
    ${sel.length < MC_MAX ? `<div class="m mt">${sel.length ? 'زوّد لاعب' : 'اختار لاعب'}</div><div class="evs" style="grid-template-columns:1fr"><div>${opts.length ? opts.map(x => `<button class="evp" data-act="mca" data-k="${x.k}">${name(x.k)} <span class="sub">${N(x.r.users.length)}</span></button>`).join('') : '<span class="m">مفيش لعيبة بالاسم ده.</span>'}</div></div>` : ''}
  </div>`;
}
function comboHtml(A) {
  const lab = (fid, ids) => ids.map(id => { const p = ppl(fid, id); return p ? esc(p.n) : '؟'; }).join(' + ');
  const row = (key, label, users) => `<div data-act="sx" data-k="${key}" style="cursor:pointer;padding:8px 0;border-top:1px solid rgba(var(--fg),.18)"><div class="r j"><span class="g nm" style="font-size:13px">${label}</span><span class="pl">${N(users.length)} لاعبين</span></div>${S.st.ex[key] ? nameList(users) : ''}</div>`;
  const pairs = Object.values(A.pairs).filter(x => x.users.length >= 2).sort((a, b) => b.users.length - a.users.length).slice(0, 15);
  const combos = A.combos.filter(x => x.users.length >= 2).sort((a, b) => b.users.length - a.users.length);
  return manualCombo(A) + `<div class="k"><b>أكتر لاعبين اتاخدوا مع بعض في ${scopeWord()}</b>${pairs.length ? pairs.map(x => row('p' + x.fid + ':' + x.a + '_' + x.b, lab(x.fid, [x.a, x.b]), x.users)).join('') : '<div class="m mt">مفيش ثنائي اتكرر عند أكتر من لاعب.</div>'}</div>
  <div class="k"><b>نفس التشكيلة بالظبط</b>${combos.length ? combos.map(x => row('k' + x.k, lab(x.fid, x.ids), x.users)).join('') : '<div class="m mt">مفيش تشكيلتين متطابقتين.</div>'}</div>`;
}
function searchHtml(A) {
  const q = S.st.q.trim().toLowerCase(); if (!q) return '';
  const found = [];
  scopeFx().forEach(f => { const d = S.fxdocs[f.id]; if (d) d.players.forEach(p => { if (p.n.toLowerCase().includes(q)) found.push({ fid: f.id, p, c: (A.picks[f.id + ':' + p.i] || { users: [] }).users.length }); }); });
  found.sort((a, b) => b.c - a.c);
  if (!found.length) return '<div class="k ctr">مفيش لاعب بالاسم ده في النطاق.</div>';
  return found.slice(0, 5).map(({ fid, p }) => {
    const pk = A.picks[fid + ':' + p.i], cp = A.caps[fid + ':' + p.i];
    const partners = Object.values(A.pairs).filter(x => x.fid === fid && (x.a === p.i || x.b === p.i)).sort((a, b) => b.users.length - a.users.length).slice(0, 5);
    const k1 = 'sp' + fid + ':' + p.i, k2 = 'sk' + fid + ':' + p.i;
    const tog = (key, label, users) => `<div data-act="sx" data-k="${key}" style="cursor:pointer;padding:8px 0;border-top:1px solid rgba(var(--fg),.18)"><div class="r j"><span>${label}</span><span class="m">${S.st.ex[key] ? 'إخفاء' : 'الأسماء'}</span></div>${S.st.ex[key] ? nameList(users) : ''}</div>`;
    return `<div class="k"><div class="r">${photo(p)}<div class="g"><div class="nm">${esc(p.n)} <span class="sub">${esc(tsn(fid, p))}</span></div><div class="sub">اختاره ${N(pk ? pk.users.length : 0)} · كابتن ${N(cp ? cp.users.length : 0)} · نقاطه ${N(ptsOf(fid, p.i))}</div></div></div>
      ${pk ? tog(k1, 'مين اختاره', pk.users) : ''}${cp ? tog(k2, 'مين اختاره كابتن', cp.users) : ''}
      ${partners.length ? `<div style="padding:8px 0;border-top:1px solid rgba(var(--fg),.18)"><div class="m">اتاخد معاه</div>${partners.map(x => { const o = ppl(fid, x.a === p.i ? x.b : x.a); return `<div class="r j" style="padding:4px 0"><span>${esc(o ? o.n : '؟')}</span><span class="pl">${N(x.users.length)}</span></div>`; }).join('')}</div>` : ''}</div>`;
  }).join('');
}

/* العناية المركزة: مين نسي إيه، ومين وقع في إيه */
const CARE = { badCap: 2, weakSteal: 5, wrongTeamMin: 3 };   // كابتن فاشل: نقطتين أو أقل · هلقط رزقي ضعيف: بونص ٥ نقط أو أقل · الفريق الغلط: الفرق ٣ نقط أو أكتر
const timesAr = c => c === 1 ? 'مرة واحدة' : c === 2 ? 'مرتين' : N(c) + (c <= 10 ? ' مرات' : ' مرة');
const FLAG_N = { i: 'مصاب', s: 'موقوف', u: 'غير متاح', n: 'غير متاح' };
function careHtml() {
  const roster = activeIds(), w = scopeWord();
  if (!roster.length) return '<div class="k ctr">مفيش لاعبين لسه.</div>';
  const fxs = scopeFx().filter(f => S.stats[f.id] && S.fxdocs[f.id]);
  /* الاختيارات الفعلية بعد قواعد الحساب (الكابتن والخواص المحسوبة بس) */
  const allFx = startedFx(S.gw), eff = {};
  roster.forEach(u => { eff[u] = {}; effPicks(u, allFx).forEach(it => { eff[u][it.f.id] = it; }); });
  const tmpPill = live => live ? ' <span class="pl" style="font-size:10px">مؤقت</span>' : '';
  /* hits: كل واحد ظهر في كام سطر غلط (للملخص اللي فوق) */
  const hits = {}; let counting = true;
  const capLoss = {}; let capLossLive = false;   // مجموع النقط اللي ضاعت من الكابتن الغلط
  const rep = {};   // rep[يوم][لاعب][مركز] = عدد الماتشات اللي نسي فيها المركز ده
  const count = (uids, good) => { if (counting && !good) uids.forEach(u => { hits[u] = (hits[u] || 0) + 1; }); };
  /* noCount: سطر بيكرر غلطة اتعدت في سطر تاني (زي «نسوا مركزين») */
  const row = (key, label, uids, notes, live, good, noCount) => (count(uids, good || noCount), '') + `<div data-act="sx" data-k="${key}" style="cursor:pointer;padding:8px 0;border-top:1px solid rgba(var(--fg),.18)"><div class="r j"><span class="g nm" style="font-size:13px">${label}${tmpPill(live)}</span><span class="pl${good ? '' : ' bad'}">${N(uids.length)}</span></div>${S.st.ex[key] ? nameList(uids, notes) : ''}</div>`;
  const group = (title, rows) => { rows = rows.filter(Boolean); return rows.length ? `<div class="m" style="margin-top:10px;font-weight:700;color:var(--gt)">${title}</div>${rows.join('')}` : ''; };
  const intro = `<div class="m">مين نسي إيه ومين وقع في إيه في ${w} (بعد بداية الماتش). اضغط على أي سطر تشوف الأسماء.</div>`;
  let html = '';

  fxs.forEach(f => {
    const sd = S.stats[f.id], d = S.fxdocs[f.id], sc = S.scores[f.id] || { pts: {}, st: {}, status: 'ns' };
    const ft = sc.status === 'ft', live = !ft, pts = id => (sc.pts && sc.pts[id]) || 0;
    const pl = id => d.players.find(x => x.i === id);
    const pn = id => { const o = pl(id); return o ? o.n : '؟'; };
    const per = {};
    roster.forEach(uid => {
      const p = sd.users[uid], ids = p ? p.ids : [];
      if (!ids.length) { per[uid] = { none: true, miss: [1, 2, 3, 4] }; return; }
      if (p.chip === 'free_pos') { per[uid] = { none: false, miss: Array(Math.max(0, 4 - ids.length)).fill(0) }; return; }
      const have = new Set(ids.map(id => (pl(id) || {}).p));
      per[uid] = { none: false, miss: [1, 2, 3, 4].filter(pos => !have.has(pos)) };
    });
    const played = roster.filter(u => !per[u].none);
    const label = pos => POS[pos] || 'لاعب (أي مركز)';
    const notesFor = uids => { const o = {}; uids.forEach(u => { o[u] = per[u].miss.map(p => POS[p] || 'لاعب').join('، '); }); return o; };
    const byPos = [1, 2, 3, 4, 0].map(pos => ({ pos, uids: played.filter(u => per[u].miss.includes(pos)) })).filter(x => x.uids.length);
    const grp = n => played.filter(u => per[u].miss.length === n);
    const none = roster.filter(u => per[u].none), g2 = grp(2), g3 = grp(3);
    const K = x => x + f.id;
    const dk = dayKey(koOf(f)); rep[dk] = rep[dk] || {};
    played.forEach(u => per[u].miss.filter(pos => pos > 0).forEach(pos => { const r = rep[dk][u] = rep[dk][u] || {}; r[pos] = (r[pos] || 0) + 1; }));

    /* اللعيبة: مصاب/موقوف، دكة، سالب */
    const inj = {}, bench = {}, neg = {};
    played.forEach(u => {
      const ids = sd.users[u].ids;
      if (sd.flags) { const l = ids.filter(id => sd.flags[id]).map(id => pn(id) + ' (' + FLAG_N[sd.flags[id]] + ')'); if (l.length) inj[u] = l.join('، '); }
      if (ft && sc.st && Object.keys(sc.st).length) { const l = ids.filter(id => sc.st[id] !== 1 && pts(id) === 0).map(pn); if (l.length) bench[u] = l.join('، '); }
      const ng = ids.filter(id => pts(id) < 0).map(id => pn(id) + ' ' + N(pts(id))); if (ng.length) neg[u] = ng.join('، ');
    });

    /* الكابتن: فاشل، وغلط (فيه لاعب في تشكيلته جاب أكتر) */
    const badCap = {}, wrongCap = {};
    played.forEach(u => {
      const it = eff[u][f.id]; if (!it || it.invalid || it.p.cap == null) return;
      const cp = pts(it.p.cap);
      if (cp <= CARE.badCap) badCap[u] = pn(it.p.cap) + ' جاب ' + N(cp);
      const best = it.p.ids.reduce((b, id) => pts(id) > pts(b) ? id : b, it.p.cap);
      if (pts(best) > cp) { const loss = (pts(best) - cp) * (CAP_MULT - 1);
        wrongCap[u] = 'اختار ' + pn(it.p.cap) + ' كابتن بدل ' + pn(best) + ' · خسر ' + N(loss);
        capLoss[u] = (capLoss[u] || 0) + loss; if (live) capLossLive = true; }
    });

    /* هلقط رزقي: بونص ضعيف، والفريق الغلط */
    const weak = {}, wrongTeam = {};
    if (ft) played.forEach(u => {
      const it = eff[u][f.id]; if (!it || it.invalid || it.p.chip !== 'steal' || it.p.team == null) return;
      const topOf = tid => Math.max(0, ...d.players.filter(x => x.t === tid).map(x => pts(x.i)));
      const mine = topOf(it.p.team), other = it.p.team === d.h.id ? d.a : d.h, theirs = topOf(other.id);
      if (mine <= CARE.weakSteal) weak[u] = 'البونص ' + N(mine);
      if (theirs - mine >= CARE.wrongTeamMin) wrongTeam[u] = 'كان ' + teamName(other) + ' هيجيب ' + N(theirs) + ' بدل ' + N(mine) + ' · خسر ' + N(theirs - mine);
    });

    /* قاع الماتش، والنجم اللي محدش شافه */
    const tot = {}; played.forEach(u => { const it = eff[u][f.id]; tot[u] = it ? it.c.total : 0; });
    const vals = [...new Set(Object.values(tot))].sort((a, b) => a - b);
    /* أقل واحد أو اتنين: لو الأقل لوحده بنضيف اللي بعده، ولو كله نفس النقط مفيش قاع */
    let bottom = [];
    if (vals.length > 1) { bottom = played.filter(u => tot[u] === vals[0]); if (bottom.length === 1 && vals.length > 2) bottom = played.filter(u => tot[u] <= vals[1]); }
    const bottomNotes = {}; bottom.forEach(u => { bottomNotes[u] = N(tot[u]) + ' نقطة'; });
    const top = Math.max(0, ...d.players.map(x => pts(x.i)));
    const stars = top > 0 ? d.players.filter(x => pts(x.i) === top) : [];
    const sawStar = stars.length ? played.filter(u => stars.some(x => sd.users[u].ids.includes(x.i))) : [];
    const starName = stars.map(x => x.n).join(' و');
    const capStar = played.filter(u => { const it = eff[u][f.id]; return it && !it.invalid && it.p.cap != null && stars.some(x => x.i === it.p.cap); });

    const ks = o => Object.keys(o);
    const body = [
      group('التشكيلة', [
        ...byPos.map(x => row(K('cp' + x.pos + ':'), 'نسوا ' + label(x.pos), x.uids)),
        g2.length ? row(K('c2'), 'نسوا مركزين', g2, notesFor(g2), false, false, true) : '',
        g3.length ? row(K('c3'), 'نسوا ٣ مراكز', g3, notesFor(g3), false, false, true) : '',
        none.length ? row(K('c4'), 'ما اختاروش خالص', none) : ''
      ]),
      group('اللعيبة', [
        ks(inj).length ? row(K('ci'), 'اختاروا لاعب مصاب أو موقوف', ks(inj), inj) : '',
        ks(bench).length ? row(K('cb'), 'لعيبة قعدوا دكة وجابوا صفر', ks(bench), bench) : '',
        ks(neg).length ? row(K('cn'), 'لاعب جاب سالب', ks(neg), neg, live) : ''
      ]),
      group('الكابتن', [
        ks(badCap).length ? row(K('cf'), 'كابتن فاشل (' + N(CARE.badCap) + ' نقط أو أقل)', ks(badCap), badCap, live) : '',
        ks(wrongCap).length ? row(K('cw'), 'كابتن غلط', ks(wrongCap), wrongCap, live) : ''
      ]),
      group('هلقط رزقي', [
        ks(weak).length ? row(K('sw'), 'البونص كان ضعيف (' + N(CARE.weakSteal) + ' نقط أو أقل)', ks(weak), weak) : '',
        ks(wrongTeam).length ? row(K('st'), 'لقط من الفريق الغلط', ks(wrongTeam), wrongTeam) : ''
      ]),
      group('النتيجة', [
        bottom.length ? row(K('bt'), 'قاع الماتش', bottom, bottomNotes, live) : '',
        stars.length ? (sawStar.length ? row(K('ms'), 'شافوا النجم: ' + esc(starName) + ' (' + N(top) + ')', sawStar, null, live, true) : `<div class="m" style="padding:8px 0;border-top:1px solid rgba(var(--fg),.18)">النجم ${esc(starName)} (${N(top)}): محدش شافه</div>`) : '',
        capStar.length ? row(K('mc'), 'اختاروا النجم كابتن', capStar, null, live, true) : ''
      ])
    ].join('');
    html += `<div class="k"><div class="r j"><b>${esc(fxTitle(f))}</b><span class="m">${ft ? 'انتهى' : 'شغال'}</span></div>${body || '<div class="m mt">الكل تمام في الماتش ده ✓</div>'}${!ft ? '<div class="m mt">الدكة وهلقط رزقي بيظهروا بعد نهاية الماتش.</div>' : ''}</div>`;
  });
  if (!fxs.length) html += '<div class="k ctr">لسه مفيش إحصائيات جاهزة في النطاق ده.</div>';

  /* نسوا الكابتن: لكل يوم ماتشاته كلها بدأت */
  const capRows = [...new Set(fxs.map(f => dayKey(koOf(f))))].sort().map(dk => {
    const dayAll = gwFixtures(S.gw).filter(f => koOf(f) && dayKey(koOf(f)) === dk);
    const started = dayAll.every(f => allFx.some(x => String(x.id) === String(f.id)));
    const label = 'يوم ' + fmtDay(Date.parse(dk + 'T12:00:00Z'));
    if (!started) return `<div class="m" style="padding:8px 0;border-top:1px solid rgba(var(--fg),.18)">${esc(label)}: بيظهر بعد ما كل ماتشات اليوم تبدأ.</div>`;
    const forgot = roster.filter(u => {
      const had = dayAll.some(f => S.stats[f.id] && S.stats[f.id].users[u] && S.stats[f.id].users[u].ids.length);
      const cap = dayAll.some(f => S.stats[f.id] && S.stats[f.id].users[u] && S.stats[f.id].users[u].cap != null);
      return had && !cap;
    });
    return forgot.length ? row('cc' + dk, esc(label), forgot) : `<div class="m" style="padding:8px 0;border-top:1px solid rgba(var(--fg),.18)">${esc(label)}: الكل اختار كابتن ✓</div>`;
  });
  if (capRows.length) html += `<div class="k"><b>نسوا الكابتن</b>${capRows.join('')}</div>`;

  /* الخواص المنسية: بتظهر في آخر الجولة */
  const gwAll = gwFixtures(S.gw), done = gwAll.length > 0 && gwAll.every(f => koOf(f) && Date.now() > koOf(f) + END_AFTER);
  if (!done) html += '<div class="k"><b>الخواص المنسية</b><div class="m mt">بتظهر في آخر الجولة، بعد ما كل الماتشات تخلص.</div></div>';
  else {
    /* بنعدّ الخواص اللي اتحسبت فعلاً (مثلاً هلقط رزقي من غير فريق تعتبر منسية) */
    const used = {};
    roster.forEach(u => { used[u] = new Set(Object.values(eff[u]).filter(it => it.p.chip && !it.invalid).map(it => it.p.chip)); });
    const z = roster.filter(u => used[u].size === 0), o1 = roster.filter(u => used[u].size === 1);
    html += `<div class="k"><b>الخواص المنسية في الجولة ${N(S.gw)}</b>${z.length ? row('cz', 'نسوا الخاصيتين', z) : ''}${o1.length ? row('co', 'نسوا خاصية واحدة', o1) : ''}${!z.length && !o1.length ? '<div class="m mt">الكل استخدم خاصيتين ✓</div>' : ''}</div>`;
  }

  /* الكروت اللي جاية بتلخص اللي فوق، فمش بتتعد تاني في الملخص */
  counting = false;

  /* سطر ترتيب: الأسماء مترتبة من الأكتر للأقل */
  const rankRow = (key, label, map, fmt, live) => {
    const uids = Object.keys(map).sort((a, b) => map[b] - map[a] || byName(nm(a), nm(b)));
    const notes = {}; uids.forEach(u => { notes[u] = fmt(map[u]); });
    return `<div data-act="sx" data-k="${key}" style="cursor:pointer;padding:8px 0;border-top:1px solid rgba(var(--fg),.18)"><div class="r j"><span class="g nm" style="font-size:13px">${label}${tmpPill(live)}</span><span class="m">${S.st.ex[key] ? 'إخفاء' : 'الأسماء'}</span></div>${S.st.ex[key] ? nameList(uids, notes, true) : ''}</div>`;
  };

  /* نفس الغلطة اتكررت: نسي نفس المركز في أكتر من ماتش في نفس اليوم */
  const repRows = Object.keys(rep).sort().map(dk => {
    const notes = {};
    Object.entries(rep[dk]).forEach(([u, m]) => {
      const l = Object.entries(m).filter(([, c]) => c > 1).map(([pos, c]) => POS[pos] + ' ×' + N(c));
      if (l.length) notes[u] = l.join('، ');
    });
    const uids = Object.keys(notes);
    return uids.length ? row('cr' + dk, 'يوم ' + esc(fmtDay(Date.parse(dk + 'T12:00:00Z'))), uids, notes) : '';
  }).filter(Boolean);
  if (repRows.length) html += `<div class="k"><b>نفس الغلطة اتكررت</b><div class="m mt">نسوا نفس المركز في أكتر من ماتش في نفس اليوم.</div>${repRows.join('')}</div>`;

  /* خسارة الكابتن الغلط على مدار النطاق كله */
  if (Object.keys(capLoss).length) {
    const totalLoss = Object.values(capLoss).reduce((a, b) => a + b, 0);
    html += `<div class="k"><div class="r j"><b>خسارة الكابتن الغلط في ${w}</b><span class="pl bad">${N(totalLoss)}</span></div><div class="m mt">مجموع النقط اللي ضاعت عشان الكابتن ماكانش أحسن لاعب في التشكيلة.</div>${rankRow('closs', 'مين خسر أكتر', capLoss, v => 'خسر ' + N(v) + ' نقطة', capLossLive)}</div>`;
  }

  /* الملخص: زبون العناية */
  let summary = '';
  const hitIds = Object.keys(hits);
  if (hitIds.length) {
    const mx = Math.max(...Object.values(hits)), kings = hitIds.filter(u => hits[u] === mx);
    summary = `<div class="k"><div class="r j"><b>زبون العناية في ${w}</b><span class="pl bad">${timesAr(mx)}</span></div><div class="nm mt">${kings.map(u => esc(nm(u)) + (u === S.user.uid ? ' (أنت)' : '')).join('، ')}</div>${rankRow('csum', 'ترتيب الكل', hits, timesAr)}</div>`;
  }
  return intro + summary + html;
}

function boardMatchView(tabs) {

/* تشكيلة لاعب في الجولة أو في ماتش: بنطبّق نفس قواعد الحساب (أول خاصيتين، وكابتن واحد في اليوم) */
function effPicks(uid, fxs) {
  const list = fxs.filter(f => S.stats[f.id] && S.stats[f.id].users[uid] && S.fxdocs[f.id]).sort((a, b) => koOf(a) - koOf(b));
  const used = {}; let nUsed = 0; const capDay = {};
  return list.map(f => {
    const p = { ...S.stats[f.id].users[uid] };
    const sc0 = S.scores[f.id];
    p.xb = (sc0 && sc0.xb && sc0.xb[uid]) || 0;   // نقط المحل الزيادة
    let chip = p.chip, dc = false, dcap = false, wasNew = false;
    if (chip) {
      const extra = (hasIt(p, 'chip3') && !used[chip]) || (hasIt(p, 'dup') && used[chip]);   // خاصية تالتة / مكررة (المحل)
      if ((!extra && (used[chip] || nUsed >= MAX_CHIPS)) || (chip === 'steal' && p.team !== f.h.id && p.team !== f.a.id)) { chip = null; dc = true; }
      else { wasNew = !used[chip]; if (wasNew) nUsed++; used[chip] = true; }
    }
    let cap = p.cap;
    if (cap != null) { const dk = dayKey(koOf(f)); if ((capDay[dk] || 0) >= (hasIt(p, 'dcap') ? 2 : 1)) { cap = null; dcap = true; } else capDay[dk] = (capDay[dk] || 0) + 1; }
    const eff = { ...p, chip, cap, team: chip ? p.team : null };
    /* زي Code.gs: لو الخاصية اتشالت والتشكيلة مخالفة للقواعد العادية، الماتش كله ما يتحسبش */
    if (!validIds(S.fxdocs[f.id], p.ids, chip, hasIt(p, 'p5'))) {
      if (chip && wasNew) { used[chip] = false; nUsed--; }
      if (cap != null && !dcap) capDay[dayKey(koOf(f))]--;
      const z = calcPick(f.id, { ...eff, ids: [], cap: null, chip: null });
      return { f, p: eff, c: { ...z, list: calcPick(f.id, eff).list }, droppedChip: dc, droppedCap: dcap, invalid: true };
    }
    return { f, p: eff, c: calcPick(f.id, eff), droppedChip: dc, droppedCap: dcap };
  });
}

async function makeThumb(file) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const sz = Math.min(img.width, img.height), sx = (img.width - sz) / 2, sy = (img.height - sz) / 2;
  for (const [side, q] of [[192, 0.82], [160, 0.76], [128, 0.7], [96, 0.65]]) {
    const c = document.createElement('canvas'); c.width = c.height = side;
    c.getContext('2d').drawImage(img, sx, sy, sz, sz, 0, 0, side, side);
    const url = c.toDataURL('image/jpeg', q);
    if (url.length < 40000) return url;
  }
  throw new Error('الصورة كبيرة');
}

  try {

function detHtml() {

/* سطور حاجة المحل في تفاصيل النقط (من pboard: fx.it[uid]) */
function pItemLines(x, d) {
  const it = x && x.it && x.it[S.user.uid]; if (!it) return '';

  const cs = String(it.c || '').split(','), has = c => cs.includes(c);
  let h = cs.map(c => ln(COIN + ' ' + esc(itemDef('p', c).n), '')).join('');
  if (has('dbl') && it.x2) h += ln('توقعك التاني ' + scoreHtml(it.x2[0], it.x2[1]), it.alt ? 'هو اللي اتحسب' : 'الأول أحسن');
  if (it.b) h += ln('النتيجة الذهبية', '+' + N(it.b));
  if (has('q3') && it.k3) h += ln(esc(PQ[it.k3] ? PQ[it.k3].s : it.k3) + ': ' + esc(pqAnsLabel(it.k3, it.v3, d)), it.q3 < 0 ? 'لسه' : '+' + N(Math.max(0, it.q3 || 0)));

}

const monthName = ym => { const [y, m] = ym.split('-').map(Number); return new Intl.DateTimeFormat('ar-EG', { month: 'long', timeZone: 'UTC' }).format(Date.UTC(y, m - 1, 15)); };

    .sort((a, b) => (b.pts - a.pts) || (b.ex - a.ex) || byName(a.name, b.name));
  let rank = 0, prev = null;
  list.forEach((r, i) => { if (!prev || r.pts !== prev.pts || r.ex !== prev.ex) rank = i + 1; r.rank = rank; prev = r; });

  ${list.slice(3).map(r => { const mine = r.uid === S.user.uid, bg = bgCss('p', r.uid), ds = decoSub('p', r.uid); return `<div class="k r" style="${bg ? bg + (mine ? 'border-color:var(--af)' : '') : mine ? 'border-color:var(--af);background:rgba(var(--afr),.26)' : ''}"><span class="d" style="width:26px;text-align:center;color:var(--mu)">${N(r.rank)}</span>${avatarL('p', r.uid, r.name)}<div class="g"><div class="nm">${decoName('p', r.uid, r.name)}${mine ? ' (أنت)' : ''}</div><div class="sub">${ds ? ds + ' · ' : ''}${r.ex ? N(r.ex) + ' نتيجة مظبوطة' : 'مفيش نتايج مظبوطة'}</div></div><span class="d" style="font-size:20px">${sN(r.pts)}</span></div>`; }).join('')}`}
  </div>`;

/* ───── الحفظ والمعزز ───── */
async function savePred() {
  const sh = S.pr.sheet, fid = String(sh.fid), d = S.fxdocs[fid];
  if (isLocked(fid)) { S.pr.sheet = null; render(); return toast('الماتش بدأ، التوقع اتقفل'); }
  const prev = S.pr.preds[fid], ans = {};
  (d.q || []).forEach(k => { if (sh.ans[k] != null) ans[k] = sh.ans[k]; });
  try {
    await setDoc(doc(db, 'preds', fid + '_' + S.user.uid), { uid: S.user.uid, gw: d.gw, fid, h: sh.h, a: sh.a, ans, boost: !!(prev && prev.boost), updatedAt: serverTimestamp() });
    S.pr.preds[fid] = { h: sh.h, a: sh.a, ans, boost: !!(prev && prev.boost) };
    /* بيانات المحل: النتيجة التانية أو إجابة السؤال التالت */
    const pitD = myPItem(fid, 'dbl'), pit3 = myPItem(fid, 'q3');
    if (pitD) await setItemX(pitD, { h: sh.h2, a: sh.a2 }).catch(e => { console.error(e); toast('مقدرتش أحفظ التوقع التاني'); });
    if (pit3 && d.q3) await setItemX(pit3, { v: sh.ans[d.q3] ?? null }).catch(e => { console.error(e); toast('مقدرتش أحفظ السؤال التالت'); });
    S.pr.sheet = null; toast('اتحفظ التوقع ✓'); render();
  } catch (e) { console.error(e); toast(e.code === 'permission-denied' ? 'الحفظ مرفوض: الماتش ممكن يكون بدأ أو حسابك محظور' : 'مقدرتش أحفظ، تأكد من النت'); }
}
async function togglePredBoost(fid) {
  const P = S.pr, p = P.preds[fid], uid = S.user.uid;
  if (!p) return toast('احفظ توقعك الأول');
  if (isLocked(fid)) return toast('الماتش بدأ');
  const inGw = new Set(gwFixtures(S.gw).map(f => String(f.id)));
  const other = Object.keys(P.preds).find(k => k !== fid && P.preds[k].boost && inGw.has(k) && kickoffOf(k));
  if (!p.boost && other && isLocked(other)) return toast('المعزز اتثبّت على ماتش بدأ في الجولة دي');
  const b = writeBatch(db);
  const put = (k, on) => { const x = P.preds[k]; b.set(doc(db, 'preds', k + '_' + uid), { uid, gw: S.gw, fid: k, h: x.h, a: x.a, ans: x.ans || {}, boost: on, updatedAt: serverTimestamp() }); };
  if (p.boost) put(fid, false);
  else { if (other) put(other, false); put(fid, true); }
  try {

async function buyItem(cur, item, x, gw) {
  const uid = S.user.uid, def = itemDef(cur, item), price = def.p;
  const wr = await getDoc(doc(db, 'wallet', uid));
  if (!wr.exists()) throw new Error('nowallet');
  const w = wr.data(), have = (w['e' + cur] || 0) - (w['s' + cur] || 0);
  if (have < price) throw new Error('nobal');
  const n = (w.n || 0) + 1, upd = { n };
  upd['s' + cur] = (w['s' + cur] || 0) + price;
  const data = { uid, n, cur, item, k: isPtItem(item) ? 'pt' : 'cos', price, gw: gw ?? null, t: null, at: null, createdAt: serverTimestamp() };
  if (x) data.x = x;
  const b = writeBatch(db);
  b.update(doc(db, 'wallet', uid), upd);
  b.set(doc(db, 'buys', uid + '_' + n), data);
  await b.commit();
  S.shop.w = { ...w, ...upd };
  S.shop.buys.push({ id: uid + '_' + n, ...data, createdAt: Date.now() });
}
async function setTarget(b, fid) {

  await updateDoc(doc(db, 'buys', b.id), { t: fid == null ? null : String(fid), gw: g, at: serverTimestamp() });
  b.t = fid == null ? null : String(fid); b.gw = g;
}

    const t = S.tours.find(x => x.id === el.dataset.id); if (!t) return;
    const to = !t.archived;
    if (!confirm(to ? 'تشيل "' + t.name + '" من الواجهة عند كل اللاعبين؟ (البيانات بتفضل موجودة)' : 'ترجّع البطولة للواجهة عند الكل؟')) return;
    try { await updateDoc(doc(db, 'tournaments', t.id), { archived: to }); t.archived = to; toast(to ? 'اتأرشفت ✓' : 'اترجعت ✓'); } catch (e) { toast('مقدرتش: ' + (e.code || e.message)); }
    render();
  }
});
vTourList = function () {
  const hid = hiddenTours(), all = S.tours;
  const isHid = t => hid.has(t.id) || t.archived;
  const shown = all.filter(t => S.showHid || !isHid(t)), nh = all.filter(isHid).length;
  const card = t => `<div class="k" style="${isHid(t) ? 'opacity:.6;' : ''}padding:0"><div class="r"><div class="g" data-act="topen" data-id="${esc(t.id)}" style="cursor:pointer;padding:12px"><div class="r j"><b style="font-size:17px">${esc(t.name)}</b>${t.status === 'draft' ? '<span class="pl">مسودة</span>' : '<span class="pl ok">شغالة</span>'}</div><div class="m mt">${t.teams ? N(Object.keys(t.teams).length) + ' فريق (' + N(t.team.size) + ' ضد ' + N(t.team.size) + ')' : N(Object.keys(t.players || {}).length) + ' لاعب'} · ${t.cfg.groups === 1 ? 'دوري واحد' : N(t.cfg.groups) + ' مجموعات'} · ${SRC_LBL[t.src] ? SRC_LBL[t.src] + ' · ' : ''}${t.scope === 'day' ? 'مواجهات بنقط اليوم' : 'مواجهات بنقط الجولة'}${t.archived ? ' · متأرشفة' : ''}</div></div>
    <div style="display:flex;flex-direction:column;gap:4px;padding:8px;flex:none">${hid.has(t.id) ? `<button class="bt" style="height:34px;padding:0 10px;font-size:12px" data-act="tunhide" data-id="${esc(t.id)}">رجّعها</button>` : `<button class="bt" style="height:34px;padding:0 10px;font-size:12px" data-act="thide" data-id="${esc(t.id)}" aria-label="إخفاء من القايمة">إخفاء ✕</button>`}${S.admin ? `<button class="bt" style="height:34px;padding:0 10px;font-size:12px" data-act="tarch" data-id="${esc(t.id)}">${t.archived ? 'رجّع للكل' : 'أرشفة للكل'}</button>` : ''}</div></div></div>`;
  return `<div class="h"><b>البطولات</b>${S.admin ? '<button class="bt on" style="height:36px;padding:0 12px" data-act="tnew">+ بطولة جديدة</button>' : ''}</div>
  <div class="f">${shown.length ? shown.map(card).join('') : '<div class="k ctr">' + (all.length ? 'كل البطولات مخفية.' : 'مفيش بطولات لسه.') + '</div>'}${nh ? `<button class="lnk" data-act="tshowhid">${S.showHid ? 'إخفاء المخفية' : 'عرض المخفية (' + N(nh) + ')'}</button>` : ''}</div>`;
};

const pgwOrig = ACTIONS.pgw;
ACTIONS.pgw = async function (el) { await pgwOrig(el); if (S.pr.tab === 'c') { await pCmpLoad(); render(); } };

showIntro();
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
